<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPSC, RSSB & State Exams Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 12px 16px; position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 760px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; font-weight: 800; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 0 12px rgba(37,99,235,0.4); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .user-pill { font-size: 11px; background: #1e293b; color: #38bdf8; padding: 6px 12px; border-radius: 20px; font-weight: 700; cursor: pointer; border: 1px solid #334155; }
    .btn-admin { background: #1e1b4b; color: #818cf8; border: 1px solid #4338ca; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    
    main { max-width: 760px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; }

    .breadcrumb-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 13px; font-weight: 700; color: #94a3b8; flex-wrap: wrap; gap: 8px; }
    .back-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .back-btn:hover { background: #334155; }

    .hero-banner { background: radial-gradient(circle at top right, #1e3a8a 0%, #0f172a 100%); border: 1px solid #1e3a8a; border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; text-align: center; }
    .hero-banner h1 { font-size: 17px; font-weight: 900; letter-spacing: 0.5px; color: #60a5fa; text-transform: uppercase; margin-bottom: 4px; }
    .hero-banner p { font-size: 12px; color: #94a3b8; }

    .search-box-wrapper { position: relative; margin-bottom: 16px; }
    .search-input { width: 100%; background: #0f172a; border: 1.5px solid #1e293b; color: #f8fafc; padding: 12px 14px 12px 42px; border-radius: 12px; font-size: 13px; outline: none; transition: 0.2s; }
    .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 14px rgba(59,130,246,0.3); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 15px; }

    .app-card {
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .app-card:hover {
      border-color: #3b82f6;
      background: #172554;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(37,99,235,0.25);
    }
    .app-card-left { display: flex; align-items: center; gap: 14px; }
    .folder-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .app-card-title { font-size: 15px; font-weight: 800; color: #f8fafc; text-transform: uppercase; letter-spacing: 0.5px; }
    .app-card-subtitle { font-size: 11px; font-weight: 700; color: #38bdf8; margin-top: 2px; }
    .app-card-arrow { font-size: 18px; color: #64748b; font-weight: 900; }

    .pulse-glow { animation: pulseGlow 1.8s infinite alternate ease-in-out; }
    @keyframes pulseGlow {
      0% { border-color: #1e3a8a; box-shadow: 0 0 4px rgba(37,99,235,0.1); }
      50% { border-color: #3b82f6; box-shadow: 0 0 16px rgba(59,130,246,0.35); }
      100% { border-color: #1e3a8a; box-shadow: 0 0 4px rgba(37,99,235,0.1); }
    }

    .test-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .test-seq-badge { background: #1e293b; color: #38bdf8; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 6px; }
    .test-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: #f1f5f9; }
    .test-card p { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    
    .tag { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 6px; }

    .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 9px 18px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; }
    .btn-success { background: #059669; color: #fff; border: none; padding: 9px 18px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; }
    .btn-outline { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    .btn-danger { background: #dc2626; color: #fff; border: none; padding: 6px 10px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .btn-share { background: #25d366; color: #ffffff; border: none; padding: 10px 18px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-lang-toggle { background: #1e3a8a; color: #38bdf8; border: 1px solid #3b82f6; border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }

    .badge-telegram { background: #0088cc; color: #fff; font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .badge-amazon { background: #ff9900; color: #111; font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 800; text-decoration: none; }

    .bulk-toolbar {
      background: #172554;
      border: 1.5px solid #3b82f6;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn { width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid #1e293b; background: #0f172a; margin-bottom: 10px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #f8fafc; transition: 0.1s ease; }
    .opt-btn:hover { border-color: #3b82f6; background: #172554; }
    .opt-btn.selected { border-color: #3b82f6; background: #1e3a8a; color: #ffffff; font-weight: 700; }
    .opt-badge { width: 28px; height: 28px; border-radius: 6px; background: #1e293b; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin-right: 12px; flex-shrink: 0; color: #94a3b8; }
    .opt-btn.selected .opt-badge { background: #3b82f6; color: #fff; }
    
    .opt-btn.sol-correct { border-color: #059669; background: #064e3b; color: #6ee7b7; font-weight: 700; }
    .opt-btn.sol-correct .opt-badge { background: #059669; color: #fff; }
    .opt-btn.sol-wrong { border-color: #dc2626; background: #7f1d1d; color: #fca5a5; font-weight: 700; }
    .opt-btn.sol-wrong .opt-badge { background: #dc2626; color: #fff; }

    .mock-top-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #1e293b; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
    .btn-grid-toggle { background: #1e3a8a; color: #ffffff; border: none; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; }

    .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; padding: 14px; }
    .modal-backdrop.active { display: flex; }
    .grid-modal { width: 100%; max-width: 500px; max-height: 85vh; background: #0f172a; border: 1px solid #334155; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; }
    .legend-box { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; font-weight: 700; padding: 10px 16px; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .grid-container { padding: 14px; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; flex: 1; background: #0b1120; }
    .p-box { height: 40px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #cbd5e1; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .p-box.ans { background: #059669; color: #fff; }
    .p-box.unans { background: #dc2626; color: #fff; }
    .p-box.review { background: #7c3aed; color: #fff; }
    .p-box.current { outline: 2px solid #38bdf8; }
    .p-box.sol-correct { background: #059669; color: #fff; }
    .p-box.sol-wrong { background: #dc2626; color: #fff; }
    .p-box.sol-skipped { background: #334155; color: #94a3b8; }

    .card { background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; padding: 16px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #94a3b8; }
    .form-control { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; font-size: 13px; }
    .form-control:focus { outline: none; border-color: #3b82f6; }
    textarea.form-control { resize: vertical; min-height: 60px; }

    .q-draft-item { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; text-align: left; }
    .leaderboard-table th { background: #1e293b; color: #38bdf8; padding: 8px 10px; border-bottom: 1px solid #334155; }
    .leaderboard-table td { padding: 8px 10px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
    .rank-badge { font-weight: 900; border-radius: 4px; padding: 2px 6px; display: inline-block; }
    .rank-1 { background: #fbbf24; color: #000; }
    .rank-2 { background: #cbd5e1; color: #000; }
    .rank-3 { background: #b45309; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo-box" onclick="goHome()">
        <div class="logo-icon">RP</div>
        <div>
          <div style="font-weight: 900; font-size: 13px; color: #f8fafc; line-height: 1.2;">RPSC, RSSB EXAM PORTAL</div>
          <div style="font-size: 10px; color: #38bdf8; font-weight: 700;">Bilingual (HI / EN) &amp; Live Rank</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="user-pill" id="userPill" onclick="promptCandidateLogin(true)">👤 Guest User</div>
        <button class="btn-admin" onclick="openAdmin()">⚙️ Admin</button>
      </div>
    </div>
  </header>

  <main id="app">
    <div style="text-align:center; padding:50px; color:#64748b; font-weight:700;">Loading portal data...</div>
  </main>

  <!-- PALETTE POPUP -->
  <div class="modal-backdrop" id="gridModalBackdrop" onclick="closeGridModal(event)">
    <div class="grid-modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <span>📑 Question Palette</span>
        <button onclick="hideGrid()" style="background:none; border:none; font-size:20px; font-weight:bold; cursor:pointer; color:#94a3b8;">✕</button>
      </div>
      <div class="legend-box" id="legendBox"></div>
      <div class="grid-container" id="gridBoxes"></div>
      <div id="gridModalFooter" style="padding: 10px 16px; border-top: 1px solid #334155; background: #0f172a; display: flex; justify-content: space-between; align-items: center;">
        <button class="btn-outline" onclick="hideGrid()">✕ Close</button>
        <button class="btn-success" id="btnModalSubmit" onclick="hideGrid(); finishTest();">Submit Test ✓</button>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://political-science-quiz-6bfb1-default-rtdb.firebaseio.com";

    let allTests = [];
    let allResources = [];
    let allLeaderboards = {};

    let currentNavPath = [];
    let currentContentType = null;
    let searchQuery = '';

    let selectedTestIds = new Set();

    let currentQuiz = null;
    let cur = 0;
    let answers = {};
    let visited = {};
    let markedReview = {};
    let timer = null;
    let sec = 0;
    let isSolutionMode = false;
    let currentLang = 'hi'; // 'hi' or 'en' (Bilingual state)

    let editingTestId = null;
    let draftQuestions = [];

    // Unique student key for accurate rank list
    let currentUser = localStorage.getItem('ps_user_name') || '';
    let userUniqueKey = localStorage.getItem('ps_user_uid') || '';
    if (!userUniqueKey) {
      userUniqueKey = 'u_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now().toString(36);
      localStorage.setItem('ps_user_uid', userUniqueKey);
    }
    let userAttempts = JSON.parse(localStorage.getItem('ps_user_attempts') || '{}');

    function cleanStr(s) {
      return (s || '').toString().trim().toLowerCase();
    }

    function cleanBaseId(idStr) {
      if(!idStr) return '';
      return idStr.toString().trim().toLowerCase().replace(/-part-\d+$/i, '');
    }

    function getItemPathArray(item) {
      if (item.path && Array.isArray(item.path) && item.path.length > 0) {
        return item.path.map(p => p.trim()).filter(Boolean);
      }
      if (item.path && typeof item.path === 'string') {
        return item.path.split('/').map(p => p.trim()).filter(Boolean);
      }
      const parts = [];
      const ex = (item.exam || item.section || '').trim();
      const sb = (item.subject || item.category || '').trim();
      if (ex) parts.push(ex);
      if (sb && sb.toLowerCase() !== 'general' && sb.toLowerCase() !== ex.toLowerCase()) {
        parts.push(sb);
      }
      return parts.length > 0 ? parts : ['1st Grade', 'General'];
    }

    function getItemPathString(item) {
      return getItemPathArray(item).join(' / ');
    }

    window.onload = () => {
      updateUserBadge();
      loadCloudData();
    };

    function updateUserBadge() {
      const el = document.getElementById('userPill');
      if (el) el.innerText = `👤 ${currentUser || 'Enter Name'}`;
    }

    function promptCandidateLogin(force = false) {
      if (!currentUser || force) {
        const name = prompt("Enter your Name for Rank List & Progress tracking:", currentUser);
        if (name !== null && name.trim()) {
          currentUser = name.trim();
          localStorage.setItem('ps_user_name', currentUser);
        } else if (!currentUser) {
          currentUser = 'Guest_' + Math.floor(1000 + Math.random() * 9000);
          localStorage.setItem('ps_user_name', currentUser);
        }
        updateUserBadge();
      }
    }

    async function loadCloudData() {
      try {
        const [testsRes, resRes, ranksRes] = await Promise.all([
          fetch(`${FIREBASE_DB_URL}/tests.json`),
          fetch(`${FIREBASE_DB_URL}/resources.json`),
          fetch(`${FIREBASE_DB_URL}/ranks.json`)
        ]);

        if (testsRes.ok) {
          const data = await testsRes.json();
          if (data) allTests = (Array.isArray(data) ? data : Object.values(data)).filter(Boolean);
        }

        if (resRes.ok) {
          const rData = await resRes.json();
          if (rData) allResources = (Array.isArray(rData) ? rData : Object.values(rData)).filter(Boolean);
        }

        if (ranksRes.ok) {
          const rankData = await ranksRes.json();
          if (rankData) allLeaderboards = rankData;
        }
      } catch (err) {
        console.error(err);
      } finally {
        goHome();
      }
    }

    async function saveToCloud() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/tests.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(allTests)
        });
        if (!res.ok) throw new Error("Status " + res.status);
      } catch (e) {
        alert('Failed to save tests to cloud.');
      }
    }

    async function saveResourcesToCloud() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/resources.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(allResources)
        });
        if (!res.ok) throw new Error("Status " + res.status);
      } catch (e) {
        alert('Failed to save study resources to cloud.');
      }
    }

    // MULTI-USER LEADERBOARD SUBMIT ENGINE (1ST ATTEMPT RULE)
    async function submitScoreToGlobalLeaderboard(testId, score, total, pct, dateStr) {
      try {
        if (!currentUser) promptCandidateLogin();
        const candidateKey = userUniqueKey;

        const res = await fetch(`${FIREBASE_DB_URL}/ranks/${testId}/${candidateKey}.json`);
        const existingRecord = await res.json();

        if (!existingRecord) {
          await fetch(`${FIREBASE_DB_URL}/ranks/${testId}/${candidateKey}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              uid: candidateKey,
              user: currentUser,
              score: score,
              total: total,
              percentage: pct,
              date: dateStr,
              timestamp: Date.now()
            })
          });
        }

        const rankRefresh = await fetch(`${FIREBASE_DB_URL}/ranks.json`);
        if (rankRefresh.ok) allLeaderboards = await rankRefresh.json() || {};
      } catch (e) {
        console.error('Error saving rank:', e);
      }
    }

    function normalizeQuestions(rawList) {
      if(!Array.isArray(rawList)) return [];
      return rawList.map(item => {
        let questionHi = item.q_hi || item.question_hi || item.q || item.question || item.title || "";
        let questionEn = item.q_en || item.question_en || item.q || item.question || "";

        let optHi = item.opt_hi || item.options_hi || item.opt || item.options || item.choices || [];
        let optEn = item.opt_en || item.options_en || item.opt || item.options || optHi;

        let ansIndex = 0;
        if (typeof item.ans !== 'undefined') ansIndex = parseInt(item.ans, 10);
        else if (typeof item.answer !== 'undefined') ansIndex = parseInt(item.answer, 10);
        else if (typeof item.correct !== 'undefined') ansIndex = parseInt(item.correct, 10);

        if(isNaN(ansIndex)) ansIndex = 0;

        let expHi = item.exp_hi || item.explanation_hi || item.exp || item.explanation || item.desc || "No explanation available.";
        let expEn = item.exp_en || item.explanation_en || item.exp || item.explanation || expHi;

        let subject = item.subject || item.sec || "General";
        let topic = item.topic || "Core Topic";

        return {
          q: questionHi,
          q_hi: questionHi,
          q_en: questionEn,
          opt: optHi,
          opt_hi: optHi,
          opt_en: optEn,
          ans: ansIndex,
          exp: expHi,
          exp_hi: expHi,
          exp_en: expEn,
          subject: subject,
          topic: topic
        };
      }).filter(item => (item.q_hi && item.q_hi.trim() !== "") || (item.q_en && item.q_en.trim() !== ""));
    }

    function goHome() {
      if(timer) clearInterval(timer);
      hideGrid();
      isSolutionMode = false;
      currentNavPath = [];
      currentContentType = null;
      searchQuery = '';
      renderPortalView();
    }

    function navigateInto(folderName) {
      currentNavPath.push(folderName);
      currentContentType = null;
      searchQuery = '';
      renderPortalView();
    }

    function navigateUp() {
      if (currentContentType) {
        currentContentType = null;
      } else if (currentNavPath.length > 0) {
        currentNavPath.pop();
      }
      searchQuery = '';
      renderPortalView();
    }

    function handleSearch(val) {
      searchQuery = val.toLowerCase().trim();
      renderPortalView(true);
    }

    function renderPortalView(isLiveSearch = false) {
      const app = document.getElementById('app');
      const pathDepth = currentNavPath.length;

      const matchesCurrentPath = (item) => {
        const parts = getItemPathArray(item);
        if (parts.length < pathDepth) return false;
        for (let i = 0; i < pathDepth; i++) {
          if (cleanStr(parts[i]) !== cleanStr(currentNavPath[i])) return false;
        }
        return true;
      };

      const matchedTests = allTests.filter(matchesCurrentPath);
      const matchedResources = allResources.filter(matchesCurrentPath);

      const subFoldersMap = new Map();
      const registerSubfolders = (list, isResource = false) => {
        list.forEach(item => {
          const parts = getItemPathArray(item);
          if (parts.length > pathDepth) {
            const nextFolder = parts[pathDepth].trim();
            const key = cleanStr(nextFolder);
            if (!subFoldersMap.has(key)) {
              subFoldersMap.set(key, { name: nextFolder, tests: 0, notes: 0, books: 0 });
            }
            const rec = subFoldersMap.get(key);
            if (isResource) {
              if (item.type === 'book') rec.books++;
              else rec.notes++;
            } else {
              rec.tests++;
            }
          }
        });
      };

      registerSubfolders(matchedTests, false);
      registerSubfolders(matchedResources, true);

      const subFolders = Array.from(subFoldersMap.values());

      if (subFolders.length > 0) {
        renderSubFoldersScreen(app, subFolders);
      } else {
        if (!currentContentType) {
          renderCategoryChooserScreen(app, matchedTests, matchedResources);
        } else {
          renderContentListScreen(app, matchedTests, matchedResources);
        }

        return (a.timestamp || 0) - (b.timestamp || 0);
      });

              <div>

    function startTestWithLang(index, chosenLang) {
      currentLang = chosenLang;
      startTest(index);
    }

    function toggleQuestionLanguage() {
      currentLang = (currentLang === 'hi') ? 'en' : 'hi';
      renderQuestionScreen();
    }

    function startTest(index) {
      currentQuiz = allTests[index];
      if(!currentQuiz || !currentQuiz.questions || currentQuiz.questions.length === 0) {
        return alert('This test has no questions yet!');
      }
      isSolutionMode = false;
      cur = 0;
      answers = {};
      visited = { 0: true };
      markedReview = {};
      sec = (currentQuiz.time || 15) * 60;
      if(timer) clearInterval(timer);
      timer = setInterval(() => {
        sec--;
        const el = document.getElementById('tm');
        if(el) {
          const m = Math.floor(sec / 60);
          const s = sec % 60;
          el.innerText = `⏳ ${m}:${s < 10 ? '0' : ''}${s}`;
        }
        if(sec <= 0) {
          clearInterval(timer);
          finishTest();
        }
      }, 1000);
      renderQuestionScreen();
    }

    function pick(i) {
      answers[cur] = i;
      renderQuestionScreen();
    }

    function renderQuestionScreen() {
      if(!isSolutionMode) visited[cur] = true;
      const q = currentQuiz.questions[cur];
      const total = currentQuiz.questions.length;

      // Dual-language text extraction with fallback
      const qText = (currentLang === 'en' && q.q_en) ? q.q_en : (q.q_hi || q.q || 'Question Text');
      const optList = (currentLang === 'en' && q.opt_en && q.opt_en.length > 0) ? q.opt_en : (q.opt_hi || q.opt || []);
      const expText = (currentLang === 'en' && q.exp_en) ? q.exp_en : (q.exp_hi || q.exp || 'No detailed explanation available.');

      let optH = '';
      optList.forEach((o, i) => {
        let optCls = '';
        let badgeIcon = '';

        if(isSolutionMode) {
          const userAns = answers[cur];
          if(i === q.ans) {
            optCls = 'sol-correct';
            badgeIcon = '<span style="font-weight:bold; color:#6ee7b7;">✓ Correct Answer</span>';
          } else if(userAns === i && userAns !== q.ans) {
            optCls = 'sol-wrong';
            badgeIcon = '<span style="font-weight:bold; color:#fca5a5;">✗ Your Answer (Incorrect)</span>';
          }
        } else {
          const sel = answers[cur] === i ? 'selected' : '';
          optCls = sel;
          badgeIcon = sel ? '<span style="font-weight:bold; color:#60a5fa;">✓</span>' : '';
        }

        const clickHandler = isSolutionMode ? '' : `onclick="pick(${i})"`;

        optH += `
          <button class="opt-btn ${optCls}" ${clickHandler} style="${isSolutionMode ? 'cursor:default;' : ''}">
            <div style="display:flex; align-items:center;">
              <span class="opt-badge">${String.fromCharCode(65 + i)}</span>
              <span>${o}</span>
            </div>
            ${badgeIcon}
          </button>
        `;
      });

      const m = Math.floor(sec / 60);
      const s = sec % 60;

      let topControls = '';
      if(isSolutionMode) {
        topControls = `
          <div class="mock-top-bar" style="border-color:#059669;">
            <button class="btn-grid-toggle" style="background:#059669;" onclick="showGrid()">
              ☰ Palette (${cur + 1}/${total})
            </button>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="btn-lang-toggle" onclick="toggleQuestionLanguage()">
                🌐 ${currentLang === 'hi' ? 'Switch to EN' : 'Switch to हिन्दी'}
              </button>
              <button class="btn-outline" style="padding:5px 10px;" onclick="finishTest()">Scorecard</button>
            </div>
          </div>
        `;
      } else {
        topControls = `
          <div class="mock-top-bar">
            <button class="btn-grid-toggle" onclick="showGrid()">
              ☰ Q 1-${total} (Palette)
            </button>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="btn-lang-toggle" onclick="toggleQuestionLanguage()" title="Click to switch language">
                🌐 ${currentLang === 'hi' ? 'EN' : 'हिन्दी'}
              </button>
              <span id="tm" style="font-weight:800; font-size:13px; background:#1e293b; color:#38bdf8; padding:5px 10px; border-radius:6px;">⏳ ${m}:${s < 10 ? '0' : ''}${s}</span>
              <button onclick="if(confirm('Exit the test?')) renderPortalView()" style="background:none; border:none; color:#ef4444; font-size:12px; font-weight:700; cursor:pointer;">✕ Exit</button>
            </div>
          </div>
        `;
      }

      let explanationBox = '';
      if(isSolutionMode) {
        explanationBox = `
          <div style="background:#172554; border-left:4px solid #3b82f6; padding:12px; border-radius:6px; margin-top:14px; font-size:13px; color:#cbd5e1; line-height:1.5;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span style="font-weight:800; color:#93c5fd;">💡 Detailed Solution &amp; Explanation (${currentLang === 'hi' ? 'हिन्दी' : 'English'}):</span>
            </div>
            <div>${expText}</div>
          </div>
        `;
      }

      let footerActions = '';
      if(isSolutionMode) {
        footerActions = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
            <button class="btn-outline" onclick="prevQ()" ${cur === 0 ? 'disabled style="opacity:0.5;"' : ''}>← Previous</button>
            <button class="btn-outline" onclick="nextQ()" ${cur === total - 1 ? 'disabled style="opacity:0.5;"' : ''}>Next →</button>
          </div>
        `;
      } else {
        footerActions = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap; gap:8px;">
            <div style="display:flex; gap:8px;">
              <button class="btn-outline" onclick="prevQ()" ${cur === 0 ? 'disabled style="opacity:0.5;"' : ''}>← Back</button>
              <button class="btn-outline" style="border-color:#7c3aed; color:#c4b5fd;" onclick="toggleReview()">${markedReview[cur] ? '★ Marked' : '☆ Review'}</button>
            </div>
            <div style="display:flex; gap:8px;">
              ${cur < total - 1 ? '<button class="btn-primary" onclick="nextQ()">Save & Next →</button>' : '<button class="btn-success" onclick="finishTest()">Submit Test ✓</button>'}
            </div>
          </div>
        `;
      }

      document.getElementById('app').innerHTML = `
        ${topControls}
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="font-size:12px; color:#94a3b8; font-weight:700;">Question ${cur + 1} of ${total}</span>
            <span style="font-size:10px; color:#38bdf8; font-weight:800; background:#172554; padding:2px 8px; border-radius:10px;">${currentLang === 'hi' ? 'हिन्दी' : 'English'}</span>
          </div>
          <h2 style="font-size:16px; font-weight:800; line-height:1.5; margin-bottom:16px; color:#f8fafc;">${qText}</h2>
          ${optH}
          ${explanationBox}
          ${footerActions}
        </div>
      `;
    }

    function toggleReview() {
      if(isSolutionMode) return;
      markedReview[cur] = !markedReview[cur];
      renderQuestionScreen();
    }

    function nextQ() {
      if(cur < currentQuiz.questions.length - 1) {
        cur++;
        renderQuestionScreen();
      }
    }

    function prevQ() {
      if(cur > 0) {
        cur--;
        renderQuestionScreen();
      }
    }

    function showGrid() {
      if(!currentQuiz) return;
      const total = currentQuiz.questions.length;
      let gridHtml = '';

      if(isSolutionMode) {
        let correctC = 0, wrongC = 0, skippedC = 0;
        for(let i = 0; i < total; i++) {
          let cls = '';
          const userAns = answers[i];
          const isCorrect = userAns === currentQuiz.questions[i].ans;

          if(userAns === undefined) {
            cls = 'sol-skipped';
            skippedC++;
          } else if(isCorrect) {
            cls = 'sol-correct';
            correctC++;
          } else {
            cls = 'sol-wrong';
            wrongC++;
          }
          if(i === cur) cls += ' current';
          gridHtml += `<div class="p-box ${cls}" onclick="jumpToQ(${i})">${i + 1}</div>`;
        }

        document.getElementById('legendBox').innerHTML = `
          <div class="legend-item"><span class="legend-dot" style="background:#059669;"></span> Correct (${correctC})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#dc2626;"></span> Incorrect (${wrongC})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#334155;"></span> Skipped (${skippedC})</div>
          <div class="legend-item"><span class="legend-dot" style="border:2px solid #38bdf8;"></span> Current</div>
        `;
        document.getElementById('btnModalSubmit').style.display = 'none';
      } else {
        let ansC = 0, revC = 0, unansC = 0, notVisC = 0;
        for(let i = 0; i < total; i++) {
          let cls = '';
          if(markedReview[i]) {
            cls = 'review';
            revC++;
          } else if(answers[i] !== undefined) {
            cls = 'ans';
            ansC++;
          } else if(visited[i]) {
            cls = 'unans';
            unansC++;
          } else {
            notVisC++;
          }

          if(i === cur) cls += ' current';
          gridHtml += `<div class="p-box ${cls}" onclick="jumpToQ(${i})">${i + 1}</div>`;
        }

    async function finishTest() {
      if(timer) clearInterval(timer);
      hideGrid();
      isSolutionMode = false;

      let cor = 0;
      let wrong = 0;
      let unattempted = 0;

      const negRate = parseFloat(currentQuiz.negativeMark || 0);
      const marksPerQ = parseFloat(currentQuiz.marksPerQuestion || 1);

      currentQuiz.questions.forEach((q, i) => {
        if(answers[i] === undefined) {
          unattempted++;
        } else if(answers[i] === q.ans) {
          cor++;
        } else {
          wrong++;
        }
      });

      const totalQs = currentQuiz.questions.length;
      const rawMarks = (cor * marksPerQ) - (wrong * negRate);
      const finalScore = Math.max(0, parseFloat(rawMarks.toFixed(2)));
      const totalPossibleMarks = totalQs * marksPerQ;
      const scorePct = Math.round((finalScore / totalPossibleMarks) * 100);

      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if(!userAttempts[currentQuiz.id]) userAttempts[currentQuiz.id] = [];
      const attemptNum = userAttempts[currentQuiz.id].length + 1;
      userAttempts[currentQuiz.id].push({
        candidate: currentUser || 'Guest User',
        score: finalScore,
        total: totalPossibleMarks,
        percentage: scorePct,
        date: dateStr
      });
      localStorage.setItem('ps_user_attempts', JSON.stringify(userAttempts));

      await submitScoreToGlobalLeaderboard(currentQuiz.id, finalScore, totalPossibleMarks, scorePct, dateStr);

      const testRanks = allLeaderboards[currentQuiz.id] || {};
      const rankList = Object.values(testRanks).sort((a,b) => b.score - a.score);
      const myRankIndex = rankList.findIndex(r => r.uid === userUniqueKey || (currentUser && cleanStr(r.user) === cleanStr(currentUser)));
      const myRank = myRankIndex !== -1 ? (myRankIndex + 1) : 1;
      const totalRanked = rankList.length || 1;

      const shareText = `🎯 I scored ${finalScore}/${totalPossibleMarks} (Rank ${myRank}/${totalRanked}) in ${currentQuiz.title}! Beat my rank: ${window.location.href}`;

      document.getElementById('app').innerHTML = `

    async function uploadJsonFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const imported = JSON.parse(text);
        const rawQs = imported.questions || (Array.isArray(imported) ? imported : []);
        const newQs = normalizeQuestions(rawQs);

        if (!newQs || newQs.length === 0) {
          alert("No valid questions found in JSON.");
          return;
        }

        const rawTargetId = imported.id || file.name.replace(/\.[^/.]+$/, "");
        const targetCleanId = cleanBaseId(rawTargetId);

        let targetTest = allTests.find(t => 
          cleanStr(t.id) === cleanStr(rawTargetId) || 
          cleanBaseId(t.id) === targetCleanId ||
          (imported.title && cleanStr(t.title) === cleanStr(imported.title))
        );

        if (targetTest) {
          const choice = confirm(`'${targetTest.title}' already exists!\n\n[OK] = MERGE ${newQs.length} questions into existing test\n[Cancel] = Create as brand new test`);
          if (choice) {
            targetTest.questions = (targetTest.questions || []).concat(newQs);
            targetTest.time = imported.time || targetTest.time || 15;
            targetTest.negativeMark = typeof imported.negativeMark !== 'undefined' ? imported.negativeMark : (targetTest.negativeMark || 0.33);
            await saveToCloud();
            alert(`🎉 Merged successfully! Test '${targetTest.title}' now has ${targetTest.questions.length} total questions.`);
            renderAdminHome();
            return;
          }
        }

        const suggestedPath = imported.path ? (Array.isArray(imported.path) ? imported.path.join(' / ') : imported.path) : (imported.exam || "1st Grade / General");
        const pathInput = prompt("Target Folder Path (Use '/' for sub-folders):", suggestedPath);
        const pathArr = (pathInput || "1st Grade / General").split('/').map(p => p.trim()).filter(Boolean);

        allTests.push({
          id: rawTargetId,
          title: imported.title || file.name.replace(/\.[^/.]+$/, ""),
          path: pathArr,
          exam: pathArr[0] || '1st Grade',
          section: pathArr[0] || '1st Grade',
          subject: pathArr[pathArr.length - 1] || 'General',
          order: imported.order || (allTests.length + 1),
          time: imported.time || 15,
          negativeMark: typeof imported.negativeMark !== 'undefined' ? imported.negativeMark : 0.33,
          desc: imported.desc || "",
          questions: newQs
        });

        await saveToCloud();
        renderAdminHome();
        alert(`🎉 Test '${allTests[allTests.length - 1].title}' saved to cloud!`);
      } catch (err) {
        alert("Invalid JSON format.");
      } finally {
        event.target.value = '';
      }
    }

    async function importFromPasteBox() {
      const txt = document.getElementById('raw-json-paste').value.trim();
      if(!txt) return alert('Please paste JSON data first!');
      try {
        const imported = JSON.parse(txt);
        let listToAdd = Array.isArray(imported) ? imported : [imported];
        let mergedCount = 0;
        let createdCount = 0;

        listToAdd.forEach(newT => {
          const newQs = normalizeQuestions(newT.questions || (Array.isArray(newT) ? newT : []));
          const rawId = newT.id ? newT.id.trim() : '';
          const targetCleanId = cleanBaseId(rawId);

          let existingTest = null;
          if (rawId) {
            existingTest = allTests.find(x => cleanStr(x.id) === cleanStr(rawId) || cleanBaseId(x.id) === targetCleanId);
          }
          if (!existingTest && newT.title) {
            existingTest = allTests.find(x => cleanStr(x.title) === cleanStr(newT.title));
          }

          if (existingTest) {
            existingTest.questions = (existingTest.questions || []).concat(newQs);
            if (newT.time) existingTest.time = newT.time;
            if (typeof newT.negativeMark !== 'undefined') existingTest.negativeMark = newT.negativeMark;
            mergedCount++;
          } else {
            const pathArr = newT.path ? (Array.isArray(newT.path) ? newT.path : newT.path.split('/')) : ['1st Grade', 'General'];
            allTests.push({
              id: rawId || ('test-' + Date.now()),
              title: newT.title || "New Mock Test",
              path: pathArr.map(p => p.trim()).filter(Boolean),
              exam: pathArr[0] || '1st Grade',
              section: pathArr[0] || '1st Grade',
              subject: pathArr[pathArr.length - 1] || 'General',
              order: newT.order || (allTests.length + 1),
              time: newT.time || 15,
              negativeMark: typeof newT.negativeMark !== 'undefined' ? newT.negativeMark : 0.33,
              desc: newT.desc || "",
              questions: newQs
            });
            createdCount++;
          }
        });

        await saveToCloud();
        renderAdminHome();
        alert(`🎉 Operation Complete!\n• Merged into existing tests: ${mergedCount}\n• Newly created: ${createdCount}`);
      } catch(e) {
        alert('Invalid JSON structure. Please check JSON format.');
      }
    }

            <div class="form-group">
              <label>Unique Test ID</label>
              <input type="text" id="t-id" class="form-control" value="${idVal}">
            </div>
            <div class="form-group">
              <label>Test Title</label>
              <input type="text" id="t-title" class="form-control" value="${titleVal}">
            </div>
          </div>

          <div class="form-group">
            <label>Folder Path (Use '/' for sub-sections. e.g. "1st Grade / Beniwal Sir / Political Science")</label>
            <input type="text" id="t-path" class="form-control" value="${pathVal}">
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
            <div class="form-group">
              <label>Sequence / Order #</label>
              <input type="number" id="t-order" class="form-control" value="${orderVal}">
            </div>
            <div class="form-group">
              <label>Time (Minutes)</label>
              <input type="number" id="t-time" class="form-control" value="${timeVal}">
            </div>
            <div class="form-group">
              <label>Negative Marking</label>
              <input type="number" step="0.01" id="t-neg" class="form-control" value="${negVal}">
            </div>
          </div>

          <div class="form-group">
            <label>Description</label>
            <input type="text" id="t-desc" class="form-control" value="${descVal}">
          </div>

          <div style="border:1.5px dashed #3b82f6; background:#172554; padding:12px; border-radius:10px; margin-bottom:14px;">
            <div style="font-weight:800; font-size:13px; margin-bottom:8px; color:#93c5fd;">+ Add New Question:</div>
            
            <div class="form-group">
              <label>Question Text (हिन्दी)</label>
              <textarea id="q-txt-hi" class="form-control" placeholder="हिन्दी में प्रश्न लिखें..."></textarea>
            </div>
            <div class="form-group">
              <label>Question Text (English)</label>
              <textarea id="q-txt-en" class="form-control" placeholder="Enter Question in English..."></textarea>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <div class="form-group"><label>Option A (HI / EN)</label><input type="text" id="op-a" class="form-control"></div>
              <div class="form-group"><label>Option B (HI / EN)</label><input type="text" id="op-b" class="form-control"></div>
              <div class="form-group"><label>Option C (HI / EN)</label><input type="text" id="op-c" class="form-control"></div>
              <div class="form-group"><label>Option D (HI / EN)</label><input type="text" id="op-d" class="form-control"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
              <div class="form-group">
                <label>Correct Option</label>
                <select id="op-ans" class="form-control">
                  <option value="0">Option A</option>
                  <option value="1">Option B</option>
                  <option value="2">Option C</option>
                  <option value="3">Option D</option>
                </select>
              </div>
              <div class="form-group">
                <label>Subject / Topic Tag</label>
                <input type="text" id="q-topic" class="form-control" placeholder="e.g. Political Theory">
              </div>
              <div class="form-group">
                <label>Explanation</label>
                <input type="text" id="q-exp" class="form-control" placeholder="Detailed Solution">
              </div>
            </div>
            <button class="btn-primary" style="width:100%; margin-top:6px;" onclick="addQuestionToDraft()">Add Question to Draft +</button>
          </div>

          <h4 style="font-size:13px; font-weight:800; margin-bottom:8px; color:#f8fafc;">
            Questions in this Test (${draftQuestions.length}):
          </h4>
          <div style="max-height:240px; overflow-y:auto; margin-bottom:16px; border:1px solid #334155; padding:8px; border-radius:8px; background:#0b1120;">
            ${qListHtml || '<div style="color:#64748b; font-size:12px; text-align:center; padding:10px;">No questions in draft.</div>'}
          </div>

          <button class="btn-success" style="width:100%; padding:13px; font-size:14px; font-weight:800;" onclick="saveDraftTest()">
            💾 Save Full Test to Cloud ✓
          </button>
        </div>
      `;
    }

    function reRenderForm() {
      const heading = editingTestId ? 'Edit Mock Test' : 'Create New Mock Test';
      renderTestFormUI(
        heading,
        document.getElementById('t-id').value,
        document.getElementById('t-title').value,
        document.getElementById('t-path').value,
        document.getElementById('t-order').value,
        document.getElementById('t-time').value,
        document.getElementById('t-neg').value,
        document.getElementById('t-desc').value
      );
    }

    function addQuestionToDraft() {
      const q_hi = document.getElementById('q-txt-hi').value.trim();
      const q_en = document.getElementById('q-txt-en').value.trim() || q_hi;
      const a = document.getElementById('op-a').value.trim();
      const b = document.getElementById('op-b').value.trim();
      const c = document.getElementById('op-c').value.trim();
      const d = document.getElementById('op-d').value.trim();
      const ans = parseInt(document.getElementById('op-ans').value, 10);
      const topic = document.getElementById('q-topic').value.trim() || 'General';
      const exp = document.getElementById('q-exp').value.trim();

      if(!q_hi && !q_en) {
        return alert('Question text is mandatory!');
      }
      if(!a || !b || !c || !d) {
        return alert('All 4 options are mandatory!');
      }

      draftQuestions.push({
        q: q_hi || q_en,
        q_hi: q_hi || q_en,
        q_en: q_en || q_hi,
        opt: [a, b, c, d],
        opt_hi: [a, b, c, d],
        opt_en: [a, b, c, d],
        ans,
        topic,
        exp,
        exp_hi: exp,
        exp_en: exp
      });
      reRenderForm();
    }

    async function saveDraftTest() {
      const testId = document.getElementById('t-id').value.trim();
      const title = document.getElementById('t-title').value.trim();
      const pathStr = document.getElementById('t-path').value.trim();
      const order = parseInt(document.getElementById('t-order').value, 10) || 1;
      const time = parseInt(document.getElementById('t-time').value, 10) || 15;
      const neg = parseFloat(document.getElementById('t-neg').value) || 0;
      const desc = document.getElementById('t-desc').value.trim();

      if(!title) return alert('Test title is required!');
      if(draftQuestions.length === 0) return alert('Add at least one question!');

      const pathArr = (pathStr || '1st Grade / General').split('/').map(p => p.trim()).filter(Boolean);
      const targetId = editingTestId || testId || ('test-' + Date.now());
      const idx = allTests.findIndex(t => t.id === targetId);

      if(idx !== -1) {
        allTests[idx] = { 
          ...allTests[idx], 
          id: targetId,
          title, 
          path: pathArr,
          exam: pathArr[0] || '1st Grade', 
          section: pathArr[0] || '1st Grade', 
          subject: pathArr[pathArr.length - 1] || 'General', 
          order,
          time, 
          negativeMark: neg,
          desc, 
          questions: draftQuestions 
        };
      } else {
        allTests.push({
          id: targetId,
          title,
          path: pathArr,
          exam: pathArr[0] || '1st Grade',
          section: pathArr[0] || '1st Grade',
          subject: pathArr[pathArr.length - 1] || 'General',
          order,
          time,
          negativeMark: neg,
          desc,
          questions: draftQuestions
        });
      }

      await saveToCloud();
      renderAdminHome();
      alert('🎉 Test saved to Cloud successfully!');
    }

    async function deleteTest(id) {
      if(!confirm('Permanently delete this test?')) return;
      allTests = allTests.filter(t => t.id !== id);
      await saveToCloud();
      renderAdminHome();
    }
  </script>
</body>
</html>

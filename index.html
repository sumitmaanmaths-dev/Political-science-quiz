<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPSC, RSSB & State Exams Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 12px 16px; position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 760px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; font-weight: 800; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 0 12px rgba(37,99,235,0.4); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .user-pill { font-size: 11px; background: #1e293b; color: #38bdf8; padding: 6px 12px; border-radius: 20px; font-weight: 700; cursor: pointer; border: 1px solid #334155; }
    .btn-admin { background: #1e1b4b; color: #818cf8; border: 1px solid #4338ca; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    
    main { max-width: 760px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; }

    .breadcrumb-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 13px; font-weight: 700; color: #94a3b8; flex-wrap: wrap; gap: 8px; }
    .back-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .back-btn:hover { background: #334155; }

    .hero-banner { background: radial-gradient(circle at top right, #1e3a8a 0%, #0f172a 100%); border: 1px solid #1e3a8a; border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; text-align: center; }
    .hero-banner h1 { font-size: 17px; font-weight: 900; letter-spacing: 0.5px; color: #60a5fa; text-transform: uppercase; margin-bottom: 4px; }
    .hero-banner p { font-size: 12px; color: #94a3b8; }

    .search-box-wrapper { position: relative; margin-bottom: 16px; }
    .search-input { width: 100%; background: #0f172a; border: 1.5px solid #1e293b; color: #f8fafc; padding: 12px 14px 12px 42px; border-radius: 12px; font-size: 13px; outline: none; transition: 0.2s; }
    .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 14px rgba(59,130,246,0.3); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 15px; }

    .app-card {
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .app-card:hover {
      border-color: #3b82f6;
      background: #172554;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(37,99,235,0.25);
    }
    .app-card-left { display: flex; align-items: center; gap: 14px; }
    .folder-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .app-card-title { font-size: 15px; font-weight: 800; color: #f8fafc; text-transform: uppercase; letter-spacing: 0.5px; }
    .app-card-subtitle { font-size: 11px; font-weight: 700; color: #38bdf8; margin-top: 2px; }
    .app-card-arrow { font-size: 18px; color: #64748b; font-weight: 900; }

    .pulse-glow { animation: pulseGlow 1.8s infinite alternate ease-in-out; }
    @keyframes pulseGlow {
      0% { border-color: #1e3a8a; box-shadow: 0 0 4px rgba(37,99,235,0.1); }
      50% { border-color: #3b82f6; box-shadow: 0 0 16px rgba(59,130,246,0.35); }
      100% { border-color: #1e3a8a; box-shadow: 0 0 4px rgba(37,99,235,0.1); }
    }

    .test-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .test-seq-badge { background: #1e293b; color: #38bdf8; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 6px; }
    .test-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: #f1f5f9; }
    .test-card p { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    
    .tag { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 6px; }

    .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 9px 18px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; }
    .btn-success { background: #059669; color: #fff; border: none; padding: 9px 18px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; }
    .btn-outline { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    .btn-danger { background: #dc2626; color: #fff; border: none; padding: 6px 10px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .btn-share { background: #25d366; color: #ffffff; border: none; padding: 10px 18px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

    .badge-telegram { background: #0088cc; color: #fff; font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .badge-amazon { background: #ff9900; color: #111; font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 800; text-decoration: none; }

    /* Bulk Tool Bar */
    .bulk-toolbar {
      background: #172554;
      border: 1.5px solid #3b82f6;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn { width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid #1e293b; background: #0f172a; margin-bottom: 10px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #f8fafc; transition: 0.1s ease; }
    .opt-btn:hover { border-color: #3b82f6; background: #172554; }
    .opt-btn.selected { border-color: #3b82f6; background: #1e3a8a; color: #ffffff; font-weight: 700; }
    .opt-badge { width: 28px; height: 28px; border-radius: 6px; background: #1e293b; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin-right: 12px; flex-shrink: 0; color: #94a3b8; }
    .opt-btn.selected .opt-badge { background: #3b82f6; color: #fff; }
    
    .opt-btn.sol-correct { border-color: #059669; background: #064e3b; color: #6ee7b7; font-weight: 700; }
    .opt-btn.sol-correct .opt-badge { background: #059669; color: #fff; }
    .opt-btn.sol-wrong { border-color: #dc2626; background: #7f1d1d; color: #fca5a5; font-weight: 700; }
    .opt-btn.sol-wrong .opt-badge { background: #dc2626; color: #fff; }

    .mock-top-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #1e293b; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
    .btn-grid-toggle { background: #1e3a8a; color: #ffffff; border: none; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; }

    .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; padding: 14px; }
    .modal-backdrop.active { display: flex; }
    .grid-modal { width: 100%; max-width: 500px; max-height: 85vh; background: #0f172a; border: 1px solid #334155; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; }
    .legend-box { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; font-weight: 700; padding: 10px 16px; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .grid-container { padding: 14px; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; flex: 1; background: #0b1120; }
    .p-box { height: 40px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #cbd5e1; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .p-box.ans { background: #059669; color: #fff; }
    .p-box.unans { background: #dc2626; color: #fff; }
    .p-box.review { background: #7c3aed; color: #fff; }
    .p-box.current { outline: 2px solid #38bdf8; }
    .p-box.sol-correct { background: #059669; color: #fff; }
    .p-box.sol-wrong { background: #dc2626; color: #fff; }
    .p-box.sol-skipped { background: #334155; color: #94a3b8; }

    .card { background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; padding: 16px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #94a3b8; }
    .form-control { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; font-size: 13px; }
    .form-control:focus { outline: none; border-color: #3b82f6; }
    textarea.form-control { resize: vertical; min-height: 60px; }

    .q-draft-item { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo-box" onclick="goHome()">
        <div class="logo-icon">RP</div>
        <div>
          <div style="font-weight: 900; font-size: 13px; color: #f8fafc; line-height: 1.2;">RPSC, RSSB EXAM PORTAL</div>
          <div style="font-size: 10px; color: #38bdf8; font-weight: 700;">Multi-Level Hierarchy &amp; Quick Manager</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="user-pill" id="userPill" onclick="promptCandidateLogin()">👤 Guest User</div>
        <button class="btn-admin" onclick="openAdmin()">⚙️ Admin</button>
      </div>
    </div>
  </header>

  <main id="app">
    <div style="text-align:center; padding:50px; color:#64748b; font-weight:700;">Loading portal data...</div>
  </main>

  <!-- PALETTE POPUP -->
  <div class="modal-backdrop" id="gridModalBackdrop" onclick="closeGridModal(event)">
    <div class="grid-modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <span>📑 Question Palette</span>
        <button onclick="hideGrid()" style="background:none; border:none; font-size:20px; font-weight:bold; cursor:pointer; color:#94a3b8;">✕</button>
      </div>
      <div class="legend-box" id="legendBox"></div>
      <div class="grid-container" id="gridBoxes"></div>
      <div id="gridModalFooter" style="padding: 10px 16px; border-top: 1px solid #334155; background: #0f172a; display: flex; justify-content: space-between; align-items: center;">
        <button class="btn-outline" onclick="hideGrid()">✕ Close</button>
        <button class="btn-success" id="btnModalSubmit" onclick="hideGrid(); finishTest();">Submit Test ✓</button>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://political-science-quiz-6bfb1-default-rtdb.firebaseio.com";

    let allTests = [];
    let allResources = [];

    // Current navigation path array: e.g. ["1st Grade", "Beniwal Sir", "Class Quiz"]
    let currentNavPath = [];
    let currentContentType = null; // 'mocks', 'notes', 'books'
    let searchQuery = '';

    // Selected test IDs for bulk actions in Admin
    let selectedTestIds = new Set();

    let currentQuiz = null;
    let cur = 0;
    let answers = {};
    let visited = {};
    let markedReview = {};
    let timer = null;
    let sec = 0;
    let isSolutionMode = false;

    let editingTestId = null;
    let draftQuestions = [];

    let currentUser = localStorage.getItem('ps_user_name') || 'Guest User';
    let userAttempts = JSON.parse(localStorage.getItem('ps_user_attempts') || '{}');

    function cleanStr(s) {
      return (s || '').toString().trim().toLowerCase();
    }

    // Helper: Converts item's exam/section/subject/path into clean array of path parts
    function getItemPathArray(item) {
      if (item.path && Array.isArray(item.path) && item.path.length > 0) {
        return item.path.map(p => p.trim()).filter(Boolean);
      }
      if (item.path && typeof item.path === 'string') {
        return item.path.split('/').map(p => p.trim()).filter(Boolean);
      }
      const parts = [];
      const ex = (item.exam || item.section || '').trim();
      const sb = (item.subject || item.category || '').trim();
      if (ex) parts.push(ex);
      if (sb && sb.toLowerCase() !== 'general' && sb.toLowerCase() !== ex.toLowerCase()) {
        parts.push(sb);
      }
      return parts.length > 0 ? parts : ['1st Grade'];
    }

    function getItemPathString(item) {
      return getItemPathArray(item).join(' / ');
    }

    window.onload = () => {
      updateUserBadge();
      loadCloudData();
    };

    function updateUserBadge() {
      const el = document.getElementById('userPill');
      if (el) el.innerText = `👤 ${currentUser}`;
    }

    function promptCandidateLogin() {
      const name = prompt("Enter Name or Roll Number for progress tracking:", currentUser === 'Guest User' ? '' : currentUser);
      if (name !== null) {
        currentUser = name.trim() || 'Guest User';
        localStorage.setItem('ps_user_name', currentUser);
        updateUserBadge();
        renderPortalView();
      }
    }

    async function loadCloudData() {
      try {
        const [testsRes, resRes] = await Promise.all([
          fetch(`${FIREBASE_DB_URL}/tests.json`),
          fetch(`${FIREBASE_DB_URL}/resources.json`)
        ]);

        if (testsRes.ok) {
          const data = await testsRes.json();
          if (data) {
            allTests = (Array.isArray(data) ? data : Object.values(data)).filter(Boolean);
          }
        }

        if (resRes.ok) {
          const rData = await resRes.json();
          if (rData) {
            allResources = (Array.isArray(rData) ? rData : Object.values(rData)).filter(Boolean);
          }
        }
      } catch (err) {
        console.error(err);
      } finally {
        goHome();
      }
    }

    async function saveToCloud() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/tests.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(allTests)
        });
        if (!res.ok) throw new Error("Status " + res.status);
      } catch (e) {
        alert('Failed to save tests to cloud.');
      }
    }

    async function saveResourcesToCloud() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/resources.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(allResources)
        });
        if (!res.ok) throw new Error("Status " + res.status);
      } catch (e) {
        alert('Failed to save study resources to cloud.');
      }
    }

    function normalizeQuestions(rawList) {
      if(!Array.isArray(rawList)) return [];
      return rawList.map(item => {
        let questionText = item.q || item.question || item.title || "";
        let options = item.opt || item.options || item.choices || [];
        let ansIndex = 0;

        if (typeof item.ans !== 'undefined') ansIndex = parseInt(item.ans, 10);
        else if (typeof item.answer !== 'undefined') ansIndex = parseInt(item.answer, 10);
        else if (typeof item.correct !== 'undefined') ansIndex = parseInt(item.correct, 10);

        if(isNaN(ansIndex)) ansIndex = 0;

        let explanation = item.exp || item.explanation || item.desc || "No explanation available.";
        let subject = item.subject || item.sec || "General";
        let topic = item.topic || "Core Topic";

        return {
          q: questionText,
          opt: options,
          ans: ansIndex,
          exp: explanation,
          subject: subject,
          topic: topic
        };
      }).filter(item => item.q.trim() !== "");
    }

    /* NAVIGATION LOGIC - DYNAMIC UNLIMITED HIERARCHY */
    function goHome() {
      if(timer) clearInterval(timer);
      hideGrid();
      isSolutionMode = false;
      currentNavPath = [];
      currentContentType = null;
      searchQuery = '';
      renderPortalView();
    }

    function navigateInto(folderName) {
      currentNavPath.push(folderName);
      currentContentType = null;
      searchQuery = '';
      renderPortalView();
    }

    function navigateUp() {
      if (currentContentType) {
        currentContentType = null;
      } else if (currentNavPath.length > 0) {
        currentNavPath.pop();
      }
      searchQuery = '';
      renderPortalView();
    }

    function handleSearch(val) {
      searchQuery = val.toLowerCase().trim();
      renderPortalView(true);
    }

    /* RENDER PORTAL VIEW */
    function renderPortalView(isLiveSearch = false) {
      const app = document.getElementById('app');

      // Check items belonging to current path
      const pathDepth = currentNavPath.length;

      const matchesCurrentPath = (item) => {
        const parts = getItemPathArray(item);
        if (parts.length < pathDepth) return false;
        for (let i = 0; i < pathDepth; i++) {
          if (cleanStr(parts[i]) !== cleanStr(currentNavPath[i])) return false;
        }
        return true;
      };

      const matchedTests = allTests.filter(matchesCurrentPath);
      const matchedResources = allResources.filter(matchesCurrentPath);

      // Find sub-folders directly under this level
      const subFoldersMap = new Map();

      const scanForSubfolders = (list, isResource = false) => {
        list.forEach(item => {
          const parts = getItemPathArray(item);
          if (parts.length > pathDepth) {
            const nextFolder = parts[pathDepth].trim();
            const key = cleanStr(nextFolder);
            if (!subFoldersMap.has(key)) {
              subFoldersMap.set(key, { name: nextFolder, tests: 0, notes: 0, books: 0 });
            }
            const record = subFoldersMap.get(key);
            if (isResource) {
              if (item.type === 'book') record.books++;
              else record.notes++;
            } else {
              record.tests++;
            }
          }
        });
      };

      scanForSubfolders(matchedTests, false);
      scanForSubfolders(matchedResources, true);

      const subFolders = Array.from(subFoldersMap.values());

      // Leaf items that end exactly at this depth
      const exactTests = matchedTests.filter(t => getItemPathArray(t).length === pathDepth);
      const exactNotes = matchedResources.filter(r => getItemPathArray(r).length === pathDepth && r.type !== 'book');
      const exactBooks = matchedResources.filter(b => getItemPathArray(b).length === pathDepth && b.type === 'book');

      // Render View
      if (currentContentType) {
        renderLeafContentView(app, exactTests, exactNotes, exactBooks);
      } else {
        renderFolderHierarchyView(app, subFolders, exactTests, exactNotes, exactBooks);
      }

      if (isLiveSearch) {
        const input = document.getElementById('searchBarInput');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }
    }

    /* FOLDER VIEW: SUBFOLDERS + HUB OPTIONS */
    function renderFolderHierarchyView(container, subFolders, exactTests, exactNotes, exactBooks) {
      const isHome = currentNavPath.length === 0;
      const breadcrumbHtml = isHome ? '' : `
        <div class="breadcrumb-bar">
          <button class="back-btn" onclick="navigateUp()">← Back</button>
          <span>${currentNavPath.join(' &gt; ')}</span>
        </div>
      `;

      // Filter subfolders by search
      const filteredFolders = subFolders.filter(f => !searchQuery || f.name.toLowerCase().includes(searchQuery));

      let folderCardsHtml = '';
      filteredFolders.forEach(sf => {
        const glowClass = isHome ? 'pulse-glow' : '';
        folderCardsHtml += `
          <div class="app-card ${glowClass}" onclick="navigateInto('${sf.name.replace(/'/g, "\\'")}')">
            <div class="app-card-left">
              <div class="folder-icon-circle">📁</div>
              <div>
                <div class="app-card-title">${sf.name}</div>
                <div class="app-card-subtitle">FOLDER · ${sf.tests} Tests · ${sf.notes} Notes · ${sf.books} Books</div>
              </div>
            </div>
            <div class="app-card-arrow">›</div>
          </div>
        `;
      });

      // If at this folder there are direct tests/notes, show modern hub cards (Parmar style)
      let hubCardsHtml = '';
      if (!isHome && (exactTests.length > 0 || exactNotes.length > 0 || exactBooks.length > 0)) {
        hubCardsHtml = `
          <div style="margin-top: 18px; margin-bottom: 12px; font-size: 13px; font-weight: 800; color: #38bdf8; text-transform: uppercase;">
            📂 Direct Materials in this section:
          </div>
          ${exactTests.length > 0 ? `
            <div class="app-card" style="border: 2px solid #2563eb;" onclick="currentContentType = 'mocks'; renderPortalView();">
              <div class="app-card-left">
                <div class="folder-icon-circle" style="background:#1e3a8a; color:#93c5fd;">⚡</div>
                <div>
                  <div class="app-card-title" style="color:#93c5fd;">MOCK TESTS &amp; QUIZZES</div>
                  <div class="app-card-subtitle" style="color:#60a5fa;">${exactTests.length} Tests in this section</div>
                </div>
              </div>
              <div class="app-card-arrow" style="color:#60a5fa;">›</div>
            </div>
          ` : ''}
          ${exactNotes.length > 0 ? `
            <div class="app-card" style="border: 2px solid #db2777;" onclick="currentContentType = 'notes'; renderPortalView();">
              <div class="app-card-left">
                <div class="folder-icon-circle" style="background:#831843; color:#fbcfe8;">📖</div>
                <div>
                  <div class="app-card-title" style="color:#fbcfe8;">FREE NOTES &amp; PDFS</div>

          ` : ''}

            <div class="app-card" style="border: 2px solid #f59e0b;" onclick="currentContentType = 'books'; renderPortalView();">
              <div class="app-card-left">
                <div class="folder-icon-circle" style="background:#78350f; color:#fde68a;">🛒</div>
                <div>
                  <div class="app-card-title" style="color:#fde68a;">RECOMMENDED BOOKS</div>
                  <div class="app-card-subtitle" style="color:#fbbf24;">${exactBooks.length} Reference Books</div>
                </div>
              </div>
              <div class="app-card-arrow" style="color:#fbbf24;">›</div>
            </div>
          ` : ''}

      }

      container.innerHTML = `
        ${breadcrumbHtml}
        <div class="hero-banner">
          <h1>${isHome ? 'TARGET RPSC &amp; STATE EXAMS' : currentNavPath[currentNavPath.length - 1]}</h1>
          <p>${isHome ? 'Choose exam / teacher / section to explore content' : 'Select sub-section or content below'}</p>
        </div>

        <div class="search-box-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchBarInput" placeholder="Search section or topic..." oninput="handleSearch(this.value)" value="${searchQuery}">
        </div>

        <div>
          ${folderCardsHtml || (!hubCardsHtml ? '<div class="card" style="text-align:center; color:#94a3b8;">No sections or tests created here yet. You can create one from Admin.</div>' : '')}

    /* LEAF CONTENT VIEW (MOCKS, NOTES, BOOKS) */
    function renderLeafContentView(container, exactTests, exactNotes, exactBooks) {
      let title = '';
      let listHtml = '';

      if (currentContentType === 'mocks') {
        title = 'Mock Tests &amp; Quizzes';
        let filtered = exactTests.filter(t => !searchQuery || (t.title && t.title.toLowerCase().includes(searchQuery)));
        filtered.sort((a, b) => (parseInt(a.order || 9999, 10)) - (parseInt(b.order || 9999, 10)));

        if (filtered.length === 0) {
          listHtml = `<div class="card" style="text-align:center; padding:30px; color:#94a3b8;">No tests found matching search.</div>`;
        } else {
          filtered.forEach((t, i) => {
            const originalIndex = allTests.findIndex(item => item.id === t.id);
            const history = userAttempts[t.id] || [];
            let historyBadge = '';
            if (history.length > 0) {
              const lastAttempt = history[history.length - 1];
              historyBadge = `
                <div style="font-size:11px; background:#064e3b; color:#6ee7b7; padding:4px 8px; border-radius:4px; margin-top:8px; display:inline-block; font-weight:700;">
                  ✓ Attempted ${history.length} time(s) · Last Score: ${lastAttempt.score}/${lastAttempt.total} (${lastAttempt.date})
                </div>
              `;
            }

            const negMarkText = (typeof t.negativeMark !== 'undefined' && t.negativeMark > 0) 
              ? ` · Neg: -${t.negativeMark}` 
              : ' · No Neg Marking';

            listHtml += `
              <div class="test-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span class="test-seq-badge">#${t.order || (i + 1)} Test</span>
                  <span style="font-size:11px; color:#64748b;">⏱️ ${t.time || 15} Mins</span>
                </div>
                <h3>${t.title}</h3>
                <p>${t.desc || 'Mock test with detailed solutions.'}</p>
                ${historyBadge}
                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #1e293b; padding-top:12px; margin-top:12px;">
                  <span style="font-size:11px; color:#94a3b8;">📝 ${(t.questions || []).length} Qs ${negMarkText}</span>
                  <button class="btn-primary" onclick="startTest(${originalIndex})">
                    ${history.length > 0 ? '🔄 Reattempt' : 'Start Test →'}
                  </button>
                </div>
              </div>
            `;
          });
        }
      } else if (currentContentType === 'notes') {
        title = 'Notes &amp; PDFs';
        let filtered = exactNotes.filter(n => !searchQuery || (n.title && n.title.toLowerCase().includes(searchQuery)));
        filtered.sort((a, b) => (parseInt(a.order || 9999, 10)) - (parseInt(b.order || 9999, 10)));

        filtered.forEach((n, idx) => {
          listHtml += `
            <div class="test-card">
              <span class="test-seq-badge">#${n.order || (idx + 1)} PDF Note</span>
              <h3>${n.title}</h3>
              <p>${n.desc || 'Curated study PDF document.'}</p>
              <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #1e293b; padding-top:10px;">
                <span style="font-size:11px; color:#94a3b8;">Format: PDF File</span>
                <a href="${n.telegram_url || '#'}" target="_blank" class="badge-telegram">
                  📥 Download from Telegram
                </a>
              </div>
            </div>
          `;
        });
      } else {
        title = 'Recommended Books';
        let filtered = exactBooks.filter(b => !searchQuery || (b.title && b.title.toLowerCase().includes(searchQuery)));
        filtered.sort((a, b) => (parseInt(a.order || 9999, 10)) - (parseInt(b.order || 9999, 10)));

        filtered.forEach((b, idx) => {
          listHtml += `
            <div class="test-card">
              <span class="test-seq-badge">#${b.order || (idx + 1)} Book</span>
              <h3>${b.title}</h3>
              <p>${b.desc || 'Recommended reference book.'}</p>
              <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #1e293b; padding-top:10px;">
                <span style="font-size:12px; font-weight:800; color:#38bdf8;">${b.price || 'Best Price'}</span>
                <a href="${b.buy_url || '#'}" target="_blank" class="badge-amazon">
                  🛒 Buy Online
                </a>
              </div>
            </div>
          `;
        });
      }

      container.innerHTML = `
        <div class="breadcrumb-bar">
          <button class="back-btn" onclick="navigateUp()">← Back</button>
          <span>${currentNavPath.join(' / ')} &gt; ${title}</span>
        </div>

        <div class="search-box-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchBarInput" placeholder="Search in this section..." oninput="handleSearch(this.value)" value="${searchQuery}">
        </div>

        <div>${listHtml}</div>
      `;
    }

    /* TEST TAKING & SCORECARD ENGINE */
    function startTest(index) {
      currentQuiz = allTests[index];
      if(!currentQuiz || !currentQuiz.questions || currentQuiz.questions.length === 0) {
        return alert('This test has no questions yet!');
      }
      isSolutionMode = false;
      cur = 0;
      answers = {};
      visited = { 0: true };
      markedReview = {};
      sec = (currentQuiz.time || 15) * 60;
      if(timer) clearInterval(timer);
      timer = setInterval(() => {
        sec--;
        const el = document.getElementById('tm');
        if(el) {
          const m = Math.floor(sec / 60);
          const s = sec % 60;
          el.innerText = `⏳ ${m}:${s < 10 ? '0' : ''}${s}`;
        }
        if(sec <= 0) {
          clearInterval(timer);
          finishTest();
        }
      }, 1000);
      renderQuestionScreen();
    }

    function pick(i) {
      answers[cur] = i;
      renderQuestionScreen();
    }

    function renderQuestionScreen() {
      if(!isSolutionMode) visited[cur] = true;
      const q = currentQuiz.questions[cur];
      const total = currentQuiz.questions.length;

      let optH = '';
      (q.opt || []).forEach((o, i) => {
        let optCls = '';
        let badgeIcon = '';

        if(isSolutionMode) {
          const userAns = answers[cur];
          if(i === q.ans) {
            optCls = 'sol-correct';
            badgeIcon = '<span style="font-weight:bold; color:#6ee7b7;">✓ Correct Answer</span>';
          } else if(userAns === i && userAns !== q.ans) {
            optCls = 'sol-wrong';
            badgeIcon = '<span style="font-weight:bold; color:#fca5a5;">✗ Your Answer (Incorrect)</span>';
          }
        } else {
          const sel = answers[cur] === i ? 'selected' : '';
          optCls = sel;
          badgeIcon = sel ? '<span style="font-weight:bold; color:#60a5fa;">✓</span>' : '';
        }

        const clickHandler = isSolutionMode ? '' : `onclick="pick(${i})"`;

        optH += `
          <button class="opt-btn ${optCls}" ${clickHandler} style="${isSolutionMode ? 'cursor:default;' : ''}">
            <div style="display:flex; align-items:center;">
              <span class="opt-badge">${String.fromCharCode(65 + i)}</span>
              <span>${o}</span>
            </div>
            ${badgeIcon}
          </button>
        `;
      });

      const m = Math.floor(sec / 60);
      const s = sec % 60;

      let topControls = '';
      if(isSolutionMode) {
        topControls = `
          <div class="mock-top-bar" style="border-color:#059669;">
            <button class="btn-grid-toggle" style="background:#059669;" onclick="showGrid()">
              ☰ Palette (${cur + 1}/${total})
            </button>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:800; font-size:12px; color:#34d399;">📖 Solutions</span>
              <button class="btn-outline" style="padding:5px 10px;" onclick="finishTest()">Scorecard</button>
            </div>
          </div>
        `;
      } else {
        topControls = `
          <div class="mock-top-bar">
            <button class="btn-grid-toggle" onclick="showGrid()">
              ☰ Q 1-${total} (Palette)
            </button>
            <div style="display:flex; align-items:center; gap:8px;">
              <span id="tm" style="font-weight:800; font-size:13px; background:#1e293b; color:#38bdf8; padding:5px 10px; border-radius:6px;">⏳ ${m}:${s < 10 ? '0' : ''}${s}</span>
              <button onclick="if(confirm('Exit the test?')) renderPortalView()" style="background:none; border:none; color:#ef4444; font-size:12px; font-weight:700; cursor:pointer;">✕ Exit</button>
            </div>
          </div>
        `;
      }

      let explanationBox = '';
      if(isSolutionMode) {
        explanationBox = `
          <div style="background:#172554; border-left:4px solid #3b82f6; padding:12px; border-radius:6px; margin-top:14px; font-size:13px; color:#cbd5e1; line-height:1.5;">
            <div style="font-weight:800; color:#93c5fd; margin-bottom:4px;">💡 Detailed Solution &amp; Explanation:</div>
            <div>${q.exp || 'No detailed explanation provided for this question.'}</div>
          </div>
        `;
      }

      let footerActions = '';
      if(isSolutionMode) {
        footerActions = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
            <button class="btn-outline" onclick="prevQ()" ${cur === 0 ? 'disabled style="opacity:0.5;"' : ''}>← Previous</button>
            <button class="btn-outline" onclick="nextQ()" ${cur === total - 1 ? 'disabled style="opacity:0.5;"' : ''}>Next →</button>
          </div>
        `;
      } else {
        footerActions = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap; gap:8px;">
            <div style="display:flex; gap:8px;">
              <button class="btn-outline" onclick="prevQ()" ${cur === 0 ? 'disabled style="opacity:0.5;"' : ''}>← Back</button>
              <button class="btn-outline" style="border-color:#7c3aed; color:#c4b5fd;" onclick="toggleReview()">${markedReview[cur] ? '★ Marked' : '☆ Review'}</button>
            </div>
            <div style="display:flex; gap:8px;">
              ${cur < total - 1 ? '<button class="btn-primary" onclick="nextQ()">Save & Next →</button>' : '<button class="btn-success" onclick="finishTest()">Submit Test ✓</button>'}
            </div>
          </div>
        `;
      }

      document.getElementById('app').innerHTML = `
        ${topControls}
        <div class="card">
          <div style="font-size:12px; color:#94a3b8; font-weight:700; margin-bottom:6px;">Question ${cur + 1} of ${total}</div>
          <h2 style="font-size:16px; font-weight:800; line-height:1.5; margin-bottom:16px; color:#f8fafc;">${q.q}</h2>
          ${optH}
          ${explanationBox}
          ${footerActions}
        </div>
      `;
    }

    function toggleReview() {
      if(isSolutionMode) return;
      markedReview[cur] = !markedReview[cur];
      renderQuestionScreen();
    }

    function nextQ() {
      if(cur < currentQuiz.questions.length - 1) {
        cur++;
        renderQuestionScreen();
      }
    }

    function prevQ() {
      if(cur > 0) {
        cur--;
        renderQuestionScreen();
      }
    }

    function showGrid() {
      if(!currentQuiz) return;
      const total = currentQuiz.questions.length;
      let gridHtml = '';

      if(isSolutionMode) {
        let correctC = 0, wrongC = 0, skippedC = 0;
        for(let i = 0; i < total; i++) {
          let cls = '';
          const userAns = answers[i];
          const isCorrect = userAns === currentQuiz.questions[i].ans;

          if(userAns === undefined) {
            cls = 'sol-skipped';
            skippedC++;
          } else if(isCorrect) {
            cls = 'sol-correct';
            correctC++;
          } else {
            cls = 'sol-wrong';
            wrongC++;
          }
          if(i === cur) cls += ' current';
          gridHtml += `<div class="p-box ${cls}" onclick="jumpToQ(${i})">${i + 1}</div>`;
        }

        document.getElementById('legendBox').innerHTML = `
          <div class="legend-item"><span class="legend-dot" style="background:#059669;"></span> Correct (${correctC})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#dc2626;"></span> Incorrect (${wrongC})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#334155;"></span> Skipped (${skippedC})</div>
          <div class="legend-item"><span class="legend-dot" style="border:2px solid #38bdf8;"></span> Current</div>
        `;
        document.getElementById('btnModalSubmit').style.display = 'none';
      } else {
        let ansC = 0, revC = 0, unansC = 0, notVisC = 0;
        for(let i = 0; i < total; i++) {
          let cls = '';
          if(markedReview[i]) {
            cls = 'review';
            revC++;
          } else if(answers[i] !== undefined) {
            cls = 'ans';
            ansC++;
          } else if(visited[i]) {
            cls = 'unans';
            unansC++;
          } else {
            notVisC++;
          }

          if(i === cur) cls += ' current';
          gridHtml += `<div class="p-box ${cls}" onclick="jumpToQ(${i})">${i + 1}</div>`;
        }

        document.getElementById('legendBox').innerHTML = `
          <div class="legend-item"><span class="legend-dot" style="background:#059669;"></span> Answered (${ansC})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#7c3aed;"></span> Review (${revC})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#dc2626;"></span> Unanswered (${unansC})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#0f172a; border:1px solid #334155;"></span> Not Visited (${notVisC})</div>
        `;
        document.getElementById('btnModalSubmit').style.display = 'block';
      }

      document.getElementById('gridBoxes').innerHTML = gridHtml;
      document.getElementById('gridModalBackdrop').classList.add('active');
    }

    function hideGrid() {
      const modal = document.getElementById('gridModalBackdrop');
      if(modal) modal.classList.remove('active');
    }

    function closeGridModal() {
      hideGrid();
    }

    function jumpToQ(index) {
      cur = index;
      hideGrid();
      renderQuestionScreen();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function finishTest() {
      if(timer) clearInterval(timer);
      hideGrid();
      isSolutionMode = false;

      let cor = 0;
      let wrong = 0;
      let unattempted = 0;

      const negRate = parseFloat(currentQuiz.negativeMark || 0);
      const marksPerQ = parseFloat(currentQuiz.marksPerQuestion || 1);
      const topicStats = {};

      currentQuiz.questions.forEach((q, i) => {
        const topic = q.topic || 'General Topics';
        if(!topicStats[topic]) topicStats[topic] = { correct: 0, total: 0 };
        topicStats[topic].total++;

        if(answers[i] === undefined) {
          unattempted++;
        } else if(answers[i] === q.ans) {
          cor++;
          topicStats[topic].correct++;
        } else {
          wrong++;
        }
      });

      const totalQs = currentQuiz.questions.length;
      const rawMarks = (cor * marksPerQ) - (wrong * negRate);
      const finalScore = Math.max(0, parseFloat(rawMarks.toFixed(2)));
      const totalPossibleMarks = totalQs * marksPerQ;
      const scorePct = Math.round((finalScore / totalPossibleMarks) * 100);

      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if(!userAttempts[currentQuiz.id]) userAttempts[currentQuiz.id] = [];
      userAttempts[currentQuiz.id].push({
        candidate: currentUser,
        score: finalScore,
        total: totalPossibleMarks,
        percentage: scorePct,
        date: dateStr
      });
      localStorage.setItem('ps_user_attempts', JSON.stringify(userAttempts));

      const shareText = `🎯 I scored ${finalScore}/${totalPossibleMarks} (${scorePct}%) in ${currentQuiz.title}! Test link: ${window.location.href}`;

      document.getElementById('app').innerHTML = `
        <div class="card" style="text-align:center; padding:24px 16px;">
          <h2 style="font-size:20px; margin-bottom:6px; color:#f8fafc;">Performance Scorecard</h2>
          <div style="font-size:12px; color:#94a3b8; margin-bottom:16px;">Candidate: <b>${currentUser}</b> · ${dateStr}</div>

          <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px;">
            <div style="font-size:11px; text-transform:uppercase; color:#94a3b8; font-weight:700;">Final Obtained Marks</div>
            <div style="font-size:38px; font-weight:900; color:#38bdf8; margin: 4px 0;">${finalScore} <span style="font-size:16px; color:#64748b; font-weight:500;">/ ${totalPossibleMarks}</span></div>
            <div style="font-size:13px; font-weight:700; color:#60a5fa;">Accuracy: ${scorePct}%</div>
            ${negRate > 0 ? `<div style="font-size:11px; color:#f87171; margin-top:4px;">Negative deduction: -${(wrong * negRate).toFixed(2)} marks</div>` : ''}
          </div>

          <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:16px;">
            <div style="background:#064e3b; border:1px solid #047857; padding:12px; border-radius:8px;">
              <div style="font-size:18px; font-weight:800; color:#34d399;">${cor}</div>
              <div style="font-size:11px; font-weight:700; color:#a7f3d0;">Correct</div>
            </div>
            <div style="background:#7f1d1d; border:1px solid #991b1b; padding:12px; border-radius:8px;">
              <div style="font-size:18px; font-weight:800; color:#f87171;">${wrong}</div>
              <div style="font-size:11px; font-weight:700; color:#fecaca;">Incorrect</div>
            </div>
            <div style="background:#1e293b; border:1px solid #334155; padding:12px; border-radius:8px;">
              <div style="font-size:18px; font-weight:800; color:#94a3b8;">${unattempted}</div>
              <div style="font-size:11px; font-weight:700; color:#cbd5e1;">Skipped</div>
            </div>
          </div>

          <button class="btn-share" style="width:100%; margin-bottom:10px;" onclick="shareScore('${encodeURIComponent(shareText)}')">
            📤 Share Result on WhatsApp
          </button>

          <button class="btn-primary" style="width:100%; padding:12px; font-size:14px; margin-bottom:10px;" onclick="openSolutionMode(0)">
            📖 Detailed Solutions &amp; Explanations →
          </button>
          
          <button class="btn-outline" style="width:100%; padding:10px;" onclick="renderPortalView()">Return to Folder</button>
        </div>
      `;
    }

    function shareScore(encodedText) {
      window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
    }

    function openSolutionMode(index = 0) {
      isSolutionMode = true;
      cur = index;
      renderQuestionScreen();
    }

    /* ADMIN PANEL - FAST BATCH/HIERARCHY MANAGEMENT & BULK ACTIONS */
    function openAdmin() {
    const pin = prompt('Enter Admin Security PIN:');
      if (pin === '7073') {
        selectedTestIds.clear();
        renderAdminHome();
      } else if (pin !== null) {
        alert('Invalid PIN!');
      }
    }

    function toggleSelectTest(id) {
      if (selectedTestIds.has(id)) selectedTestIds.delete(id);
      else selectedTestIds.add(id);
      renderAdminHome();
    }

    function toggleSelectAll(selectAll) {
      if (selectAll) {
        allTests.forEach(t => selectedTestIds.add(t.id));
      } else {
        selectedTestIds.clear();
      }
      renderAdminHome();
    }

    /* BULK OPERATIONS */
    async function bulkMovePrompt() {
      if (selectedTestIds.size === 0) return alert('Select tests first using checkboxes!');
      const newPath = prompt(`Move ${selectedTestIds.size} selected tests to new path:\n(e.g. "1st Grade / Beniwal Sir / Class Quiz")`);
      if (!newPath || !newPath.trim()) return;

      const pathArr = newPath.split('/').map(p => p.trim()).filter(Boolean);

      allTests.forEach(t => {
        if (selectedTestIds.has(t.id)) {
          t.path = pathArr;
          t.exam = pathArr[0] || '1st Grade';
          t.section = t.exam;
          t.subject = pathArr[1] || 'General';
        }
      });

      await saveToCloud();
      alert(`✅ ${selectedTestIds.size} tests moved successfully!`);
      selectedTestIds.clear();
      renderAdminHome();
    }

    async function bulkAutoSequencePrompt() {
      if (selectedTestIds.size === 0) return alert('Select tests first using checkboxes!');
      const startNumStr = prompt(`Enter starting sequence number for ${selectedTestIds.size} tests:`, "1");
      if (startNumStr === null) return;
      let curNum = parseInt(startNumStr, 10) || 1;

      allTests.forEach(t => {
        if (selectedTestIds.has(t.id)) {
          t.order = curNum++;
        }
      });

      await saveToCloud();
      alert(`✅ Sequences updated for ${selectedTestIds.size} tests!`);
      renderAdminHome();
    }

    async function bulkDeletePrompt() {
      if (selectedTestIds.size === 0) return alert('Select tests first using checkboxes!');
      if (!confirm(`Are you sure you want to permanently delete ${selectedTestIds.size} selected tests?`)) return;

      allTests = allTests.filter(t => !selectedTestIds.has(t.id));
      await saveToCloud();
      selectedTestIds.clear();
      alert('🗑️ Selected tests deleted!');
      renderAdminHome();
    }

    function renderAdminHome() {
      // Group tests by path for clear tree view
      const sortedTests = [...allTests].sort((a,b) => {
        const pa = getItemPathString(a);
        const pb = getItemPathString(b);
        if (pa !== pb) return pa.localeCompare(pb);
        return (parseInt(a.order || 9999, 10)) - (parseInt(b.order || 9999, 10));
      });

      let testListHtml = '';
      sortedTests.forEach((t) => {
        const isChecked = selectedTestIds.has(t.id);
        const pathStr = getItemPathString(t);

        testListHtml += `
          <div style="background:#1e293b; border:1px solid ${isChecked ? '#3b82f6' : '#334155'}; border-radius:8px; padding:12px; margin-bottom:10px; display:flex; align-items:flex-start; gap:12px;">
            <input type="checkbox" style="width:18px; height:18px; margin-top:4px; cursor:pointer;" ${isChecked ? 'checked' : ''} onchange="toggleSelectTest('${t.id}')">
            
            <div style="flex:1;">
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
                <span class="tag" style="background:#0284c7; color:#fff;">📂 ${pathStr}</span>
                <span class="tag">Seq: #${t.order || 1}</span>
              </div>
              <div style="font-weight:800; font-size:14px; color:#f8fafc;">${t.title}</div>
              <div style="font-size:11px; color:#94a3b8;">${(t.questions || []).length} Qs · ${t.time || 15} Mins · Neg: -${t.negativeMark || 0}</div>
            </div>

            <div style="display:flex; flex-direction:column; gap:4px;">
              <button class="btn-outline" style="border-color:#38bdf8; color:#38bdf8; padding:5px 10px; font-size:11px;" onclick="quickEditTestPrompt('${t.id}')">⚡ Fast Move</button>
              <button class="btn-outline" style="border-color:#3b82f6; color:#60a5fa; padding:5px 10px; font-size:11px;" onclick="loadTestForEdit('${t.id}')">✏️ Edit</button>
              <button class="btn-danger" style="padding:5px 10px; font-size:11px;" onclick="deleteTest('${t.id}')">🗑️</button>
            </div>
          </div>
        `;
      });

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #334155; padding-bottom:8px;">
            <h2 style="font-size:18px; font-weight:800; color:#f8fafc;">⚙️ Multi-Level Admin Dashboard</h2>
            <button class="btn-outline" onclick="goHome()">✕ Exit Admin</button>
          </div>

          <!-- Quick Action Buttons -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
            <button class="btn-primary" style="padding:10px;" onclick="promptAddResource('note')">+ Add PDF Note</button>
            <button class="btn-outline" style="padding:10px; border-color:#f59e0b; color:#fde68a;" onclick="promptAddResource('book')">+ Add Recommended Book Link</button>
          </div>

          <!-- BULK CONTROL BAR -->
          <div class="bulk-toolbar">
            <div style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="selectAllCheckbox" style="width:18px; height:18px; cursor:pointer;" ${allTests.length > 0 && selectedTestIds.size === allTests.length ? 'checked' : ''} onchange="toggleSelectAll(this.checked)">
              <label for="selectAllCheckbox" style="font-size:12px; font-weight:800; color:#93c5fd; cursor:pointer;">
                Select All (${selectedTestIds.size}/${allTests.length})
              </label>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn-primary" style="padding:6px 12px; font-size:11px;" onclick="bulkMovePrompt()">📦 Move to Folder / Path</button>
              <button class="btn-outline" style="padding:6px 12px; font-size:11px; border-color:#38bdf8; color:#38bdf8;" onclick="bulkAutoSequencePrompt()">⚡ Auto-Sequence #</button>
              <button class="btn-danger" style="padding:6px 12px; font-size:11px;" onclick="bulkDeletePrompt()">🗑️ Delete Selected</button>
            </div>
          </div>

          <!-- Upload JSON Files -->
          <div style="background:#1e293b; border:2px dashed #3b82f6; padding:16px; border-radius:10px; margin-bottom:16px; text-align:center;">
            <div style="font-weight:800; font-size:14px; color:#60a5fa; margin-bottom:6px;">🚀 Quick Upload JSON Questions File</div>
            <input type="file" id="json-file-input" accept=".json,.txt" style="display:none;" onchange="uploadJsonFile(event)">
            <button class="btn-primary" style="padding:8px 18px;" onclick="document.getElementById('json-file-input').click()">
              📁 Choose File &amp; Upload
            </button>
          </div>

          <!-- Raw JSON Paste Box -->
          <div style="background:#1e293b; border:1px dashed #475569; padding:12px; border-radius:8px; margin-bottom:16px;">
            <div style="font-weight:700; font-size:13px; color:#cbd5e1; margin-bottom:6px;">📋 Or Paste Raw JSON Code Directly:</div>
            <textarea id="raw-json-paste" class="form-control" style="min-height:70px; font-family:monospace; font-size:12px;" placeholder="Paste JSON questions array or test object here..."></textarea>
            <button class="btn-outline" style="margin-top:8px; width:100%; border-color:#3b82f6; color:#60a5fa;" onclick="importFromPasteBox()">Save to Firebase Cloud</button>
          </div>

          <!-- Manual Create -->
          <button class="btn-success" style="width:100%; padding:11px; font-size:13px; margin-bottom:16px;" onclick="startNewTestForm()">
            + Create New Test Manually (Form)
          </button>

          <!-- Active Tests List -->
          <h3 style="font-size:14px; font-weight:800; margin-bottom:10px; color:#f8fafc;">Active Mock Tests (${allTests.length}):</h3>
          ${testListHtml || '<div style="color:#64748b; font-size:13px;">No tests found.</div>'}
        </div>
      `;
    }

    /* FAST EDIT SINGLE TEST */
    async function quickEditTestPrompt(id) {
      const t = allTests.find(item => item.id === id);
      if(!t) return;
      const currentPath = getItemPathString(t);
      const newPath = prompt(`Set Folder Path (Use '/' for sub-folders):\nExample: "1st Grade / Beniwal Sir / Class Quiz"`, currentPath);
      if(newPath === null) return;

      const newTitle = prompt("Edit Test Title:", t.title);
      if(newTitle === null) return;

      const newOrder = prompt("Edit Sequence / Order #:", t.order || 1);
      if(newOrder === null) return;

      const pathArr = newPath.split('/').map(p => p.trim()).filter(Boolean);
      t.path = pathArr;
      t.exam = pathArr[0] || '1st Grade';
      t.section = t.exam;
      t.subject = pathArr[1] || 'General';
      t.title = newTitle.trim() || t.title;
      t.order = parseInt(newOrder, 10) || t.order;

      await saveToCloud();
      alert("✅ Test updated successfully!");
      renderAdminHome();
    }

    async function promptAddResource(type) {
      const title = prompt(`Enter ${type === 'note' ? 'PDF/Note' : 'Book'} Title:`);
      if(!title) return;
      const pathStr = prompt("Folder Path (e.g. 1st Grade / Beniwal Sir / Notes):", "1st Grade / Notes");
      const order = prompt("Display Sequence Number (e.g. 1, 2, 3):", "1");
      const url = prompt(type === 'note' ? "Enter Telegram File URL or Link:" : "Enter Store/Amazon Affiliate Link:");
      if(!url) return;

      const price = type === 'book' ? prompt("Enter Book Price (optional):", "Check Online") : "";
      const pathArr = (pathStr || "1st Grade").split('/').map(p => p.trim()).filter(Boolean);

      allResources.push({
        id: 'res-' + Date.now(),
        type: type,
        title: title.trim(),
        path: pathArr,
        exam: pathArr[0] || '1st Grade',
        section: pathArr[0] || '1st Grade',
        subject: pathArr[1] || 'General',
        order: parseInt(order || 1, 10),
        desc: type === 'note' ? 'Curated PDF material.' : 'Recommended book.',
        price: price || 'Check Online',
        telegram_url: url.trim(),
        buy_url: url.trim()
      });

      await saveResourcesToCloud();
      alert(`🎉 ${type === 'note' ? 'PDF Note' : 'Book'} added successfully!`);
      renderAdminHome();
    }

    async function uploadJsonFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const imported = JSON.parse(text);
        const rawQs = imported.questions || (Array.isArray(imported) ? imported : []);
        const newQs = normalizeQuestions(rawQs);

        if (!newQs || newQs.length === 0) {
          alert("No valid questions found.");
          return;
        }

        const suggestedPath = imported.path ? (Array.isArray(imported.path) ? imported.path.join(' / ') : imported.path) : (imported.exam || "1st Grade");
        const pathInput = prompt("Target Folder Path (Use '/' for sub-folders):", suggestedPath);
        const pathArr = (pathInput || "1st Grade").split('/').map(p => p.trim()).filter(Boolean);

        const newId = imported.id || ('test-' + Date.now());
        allTests.push({
          id: newId,
          title: imported.title || file.name.replace(/\.[^/.]+$/, ""),
          path: pathArr,
          exam: pathArr[0] || '1st Grade',
          section: pathArr[0] || '1st Grade',
          subject: pathArr[1] || 'General',
          order: imported.order || (allTests.length + 1),
          time: imported.time || 15,
          negativeMark: typeof imported.negativeMark !== 'undefined' ? imported.negativeMark : 0.33,
          desc: imported.desc || "",
          questions: newQs
        });

        await saveToCloud();
        renderAdminHome();
        alert(`🎉 Test '${allTests[allTests.length - 1].title}' uploaded to '${pathArr.join(' / ')}'!`);
      } catch (err) {
        alert("Invalid JSON format.");
      } finally {
        event.target.value = '';
      }
    }

    async function importFromPasteBox() {
      const txt = document.getElementById('raw-json-paste').value.trim();
      if(!txt) return alert('Please paste JSON data first!');
      try {
        const imported = JSON.parse(txt);
        let listToAdd = Array.isArray(imported) ? imported : [imported];
        
        const pathInput = prompt("Target Folder Path for these tests (e.g. '1st Grade / Beniwal Sir / Class Quiz'):", "1st Grade");
        const pathArr = (pathInput || "1st Grade").split('/').map(p => p.trim()).filter(Boolean);

        listToAdd.forEach(newT => {
          newT.questions = normalizeQuestions(newT.questions || []);
          newT.path = pathArr;
          newT.exam = pathArr[0] || '1st Grade';
          newT.section = newT.exam;
          newT.subject = pathArr[1] || 'General';
          if(typeof newT.order === 'undefined') newT.order = allTests.length + 1;
          if(typeof newT.negativeMark === 'undefined') newT.negativeMark = 0.33;
          if(!newT.id) newT.id = 'test-' + Date.now();
          
          allTests.push(newT);
        });

        await saveToCloud();
        renderAdminHome();
        alert('🎉 Tests saved to cloud successfully!');
      } catch(e) {
        alert('Invalid JSON structure.');
      }
    }

    function startNewTestForm() {
      editingTestId = null;
      draftQuestions = [];
      renderTestFormUI('Create New Mock Test', '', '1st Grade / General', 1, 15, 0.33, '');
    }

    function loadTestForEdit(id) {
      const t = allTests.find(item => item.id === id);
      if(!t) return;
      editingTestId = id;
      draftQuestions = JSON.parse(JSON.stringify(t.questions || []));
      renderTestFormUI('Edit Mock Test', t.title, getItemPathString(t), t.order || 1, t.time || 15, typeof t.negativeMark !== 'undefined' ? t.negativeMark : 0.33, t.desc || '');
    }

    function renderTestFormUI(heading, titleVal, pathVal, orderVal, timeVal, negVal, descVal) {
      let qListHtml = '';
      draftQuestions.forEach((dq, index) => {
        qListHtml += `
          <div class="q-draft-item">
            <div style="font-size:12px; color:#cbd5e1; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
              <b>#${index + 1}</b> ${dq.q}
            </div>
            <button class="btn-danger" style="padding:4px 8px; font-size:11px;" onclick="draftQuestions.splice(${index}, 1); reRenderForm();">Delete</button>
          </div>
        `;
      });

      document.getElementById('app').innerHTML = `
        <div class="card" style="padding-bottom: 70px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid #334155; padding-bottom:10px; gap:8px;">
            <h3 style="font-size:16px; font-weight:800; color:#f8fafc;">${heading}</h3>
            <div style="display:flex; gap:6px;">
              <button class="btn-success" style="padding:7px 14px; font-size:12px;" onclick="saveDraftTest()">💾 Save to Cloud ✓</button>
              <button class="btn-outline" style="padding:7px 12px; font-size:12px;" onclick="renderAdminHome()">Cancel</button>
            </div>
          </div>

          <div class="form-group">
            <label>Test Title</label>
            <input type="text" id="t-title" class="form-control" value="${titleVal}">
          </div>

          <div class="form-group">
            <label>Folder Path (Use '/' for sub-sections. e.g. "1st Grade / Beniwal Sir / Class Quiz")</label>
            <input type="text" id="t-path" class="form-control" value="${pathVal}">
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
            <div class="form-group">
              <label>Sequence / Order #</label>
              <input type="number" id="t-order" class="form-control" value="${orderVal}">
            </div>
            <div class="form-group">
              <label>Time (Minutes)</label>
              <input type="number" id="t-time" class="form-control" value="${timeVal}">
            </div>
            <div class="form-group">
              <label>Negative Marking</label>
              <input type="number" step="0.01" id="t-neg" class="form-control" value="${negVal}">
            </div>
          </div>

          <div class="form-group">
            <label>Description</label>
            <input type="text" id="t-desc" class="form-control" value="${descVal}">
          </div>

          <!-- Question Creator -->
          <div style="border:1.5px dashed #3b82f6; background:#172554; padding:12px; border-radius:10px; margin-bottom:14px;">
            <div style="font-weight:800; font-size:13px; margin-bottom:8px; color:#93c5fd;">+ Add New Question:</div>
            <div class="form-group">
              <label>Question Text</label>
              <textarea id="q-txt" class="form-control"></textarea>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <div class="form-group"><label>Option A</label><input type="text" id="op-a" class="form-control"></div>
              <div class="form-group"><label>Option B</label><input type="text" id="op-b" class="form-control"></div>
              <div class="form-group"><label>Option C</label><input type="text" id="op-c" class="form-control"></div>
              <div class="form-group"><label>Option D</label><input type="text" id="op-d" class="form-control"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
              <div class="form-group">
                <label>Correct Option</label>
                <select id="op-ans" class="form-control">
                  <option value="0">Option A</option>
                  <option value="1">Option B</option>
                  <option value="2">Option C</option>
                  <option value="3">Option D</option>
                </select>
              </div>
              <div class="form-group">
                <label>Subject / Topic Tag</label>
                <input type="text" id="q-topic" class="form-control" placeholder="e.g. Political Theory">
              </div>
              <div class="form-group">
                <label>Explanation</label>
                <input type="text" id="q-exp" class="form-control" placeholder="Detailed Solution">
              </div>
            </div>
            <button class="btn-primary" style="width:100%; margin-top:6px;" onclick="addQuestionToDraft()">Add Question to Draft +</button>
          </div>

          <h4 style="font-size:13px; font-weight:800; margin-bottom:8px; color:#f8fafc;">
            Questions in this Test (${draftQuestions.length}):
          </h4>
          <div style="max-height:240px; overflow-y:auto; margin-bottom:16px; border:1px solid #334155; padding:8px; border-radius:8px; background:#0b1120;">
            ${qListHtml || '<div style="color:#64748b; font-size:12px; text-align:center; padding:10px;">No questions in draft.</div>'}
          </div>

          <button class="btn-success" style="width:100%; padding:13px; font-size:14px; font-weight:800;" onclick="saveDraftTest()">
            💾 Save Full Test to Cloud ✓
          </button>
        </div>
      `;
    }

    function reRenderForm() {
      const heading = editingTestId ? 'Edit Mock Test' : 'Create New Mock Test';
      renderTestFormUI(
        heading,
        document.getElementById('t-title').value,
        document.getElementById('t-path').value,
        document.getElementById('t-order').value,
        document.getElementById('t-time').value,
        document.getElementById('t-neg').value,
        document.getElementById('t-desc').value
      );
    }

    function addQuestionToDraft() {
      const q = document.getElementById('q-txt').value.trim();
      const a = document.getElementById('op-a').value.trim();
      const b = document.getElementById('op-b').value.trim();
      const c = document.getElementById('op-c').value.trim();
      const d = document.getElementById('op-d').value.trim();
      const ans = parseInt(document.getElementById('op-ans').value, 10);
      const topic = document.getElementById('q-topic').value.trim() || 'General';
      const exp = document.getElementById('q-exp').value.trim();

      if(!q || !a || !b || !c || !d) {
        return alert('Question and all 4 options are mandatory!');
      }

      draftQuestions.push({ q, opt: [a, b, c, d], ans, topic, exp });
      reRenderForm();
    }

    async function saveDraftTest() {
      const title = document.getElementById('t-title').value.trim();
      const pathStr = document.getElementById('t-path').value.trim();
      const order = parseInt(document.getElementById('t-order').value, 10) || 1;
      const time = parseInt(document.getElementById('t-time').value, 10) || 15;
      const neg = parseFloat(document.getElementById('t-neg').value) || 0;
      const desc = document.getElementById('t-desc').value.trim();

      if(!title) return alert('Test title is required!');
      if(draftQuestions.length === 0) return alert('Add at least one question!');

      const pathArr = (pathStr || '1st Grade').split('/').map(p => p.trim()).filter(Boolean);

      if(editingTestId) {
        const idx = allTests.findIndex(t => t.id === editingTestId);
        if(idx !== -1) {
          allTests[idx] = { 
            ...allTests[idx], 
            title, 
            path: pathArr,
            exam: pathArr[0] || '1st Grade', 
            section: pathArr[0] || '1st Grade', 
            subject: pathArr[1] || 'General', 
            order,
            time, 
            negativeMark: neg,
            desc, 
            questions: draftQuestions 
          };
        }
      } else {
        allTests.push({
          id: 'test-' + Date.now(),
          title,
          path: pathArr,
          exam: pathArr[0] || '1st Grade',
          section: pathArr[0] || '1st Grade',
          subject: pathArr[1] || 'General',
          order,
          time,
          negativeMark: neg,
          desc,
          questions: draftQuestions
        });
      }

      await saveToCloud();
      renderAdminHome();
      alert('🎉 Test saved to Cloud successfully!');
    }

    async function deleteTest(id) {
      if(!confirm('Permanently delete this test?')) return;
      allTests = allTests.filter(t => t.id !== id);
      await saveToCloud();
      renderAdminHome();
    }
  </script>
</body>
</html>

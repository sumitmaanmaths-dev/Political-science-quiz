    // --- AUDIO SYNTHESIZER ---
    const playTone = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(196, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch(e) {}
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [tests, setTests] = useState(() => {
        const saved = localStorage.getItem('pol_science_kautilya_v1');
        return saved ? JSON.parse(saved) : DEFAULT_TESTS;
      });

      const [view, setView] = useState('home');
      const [activeTest, setActiveTest] = useState(null);
      const [activeResult, setActiveResult] = useState(null);
      const [adminPin, setAdminPin] = useState(() => localStorage.getItem('pol_admin_pin') || '1234');
      const [isAdminAuthed, setIsAdminAuthed] = useState(false);

      const handleStartQuiz = (test) => {
        playTone('click');
        setActiveTest(test);
        setView('quiz');
      };

      const handleFinishQuiz = (result) => {
        setActiveResult(result);
        setView('result');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div 
                onClick={() => { playTone('click'); setView('home'); }} 
                className="flex items-center gap-3 cursor-pointer"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20 text-lg">
                  PS
                </div>
                <div>
                  <h1 className="font-display font-bold text-lg text-slate-900 leading-tight">Political Science Quiz</h1>
                  <p className="text-[11px] text-slate-500 font-medium">Competitive Exam Portal</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => {
                    playTone('click');
                    if (isAdminAuthed) setView('admin');
                    else {
                      const pin = prompt('Enter Admin PIN (Default: 1234):');
                      if (pin === adminPin) {
                        setIsAdminAuthed(true);
                        setView('admin');
                      } else if (pin !== null) {
                        alert('Wrong PIN!');
                      }
                    }
                  }}
                  className="px-3.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold transition-all border border-blue-200"
                >
                  ⚙️ Admin
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
            {view === 'home' && <HomeView tests={tests} onStart={handleStartQuiz} />}
            {view === 'quiz' && <QuizView test={activeTest} onFinish={handleFinishQuiz} onExit={() => setView('home')} />}
            {view === 'result' && <ResultView result={activeResult} test={activeTest} onHome={() => setView('home')} onRetry={() => handleStartQuiz(activeTest)} />}
            {view === 'admin' && (
              <AdminView 
                tests={tests} 
                onUpdateTests={(updated) => {
                  setTests(updated);
                  localStorage.setItem('pol_science_kautilya_v1', JSON.stringify(updated));
                }} 
                onClose={() => setView('home')} 
                adminPin={adminPin}
                setAdminPin={setAdminPin}
              />
            )}
          </main>
        </div>
      );
    }

    // --- HOME VIEW ---
    function HomeView({ tests, onStart }) {
      return (
        <div className="space-y-6">

                      className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm transition-all"

                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- QUIZ VIEW ---

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Political Science Quiz Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid #cbd5e1; padding: 12px 16px; position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-icon { width: 38px; height: 38px; background: #2563eb; color: #fff; font-weight: 800; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .btn-admin { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    main { max-width: 800px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; }
    .banner { background: linear-gradient(135deg, #1e40af, #3730a3); color: #fff; padding: 18px; border-radius: 12px; margin-bottom: 16px; }
    .tabs-wrapper { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; }
    .tab-btn { background: #fff; border: 1px solid #cbd5e1; color: #475569; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 16px; margin-bottom: 14px; }
    .tag { display: inline-block; background: #dbeafe; color: #1e40af; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-bottom: 6px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 10px; margin-top: 10px; }
    .btn-primary { background: #2563eb; color: #fff; border: none; padding: 8px 16px; font-size: 13px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .btn-success { background: #059669; color: #fff; border: none; padding: 9px 16px; font-size: 13px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .btn-outline { background: #fff; color: #475569; border: 1px solid #cbd5e1; padding: 6px 10px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .btn-danger { background: #ef4444; color: #fff; border: none; padding: 6px 10px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .opt-btn { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; margin-bottom: 8px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; }
    .opt-btn.selected { border-color: #2563eb; background: #eff6ff; color: #1e40af; font-weight: 600; }
    .form-group { margin-bottom: 10px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; }
    .form-control { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo-box" onclick="showHome()">
        <div class="logo-icon">PS</div>
        <div>
          <div style="font-weight: 800; font-size: 15px;">Political Science Quiz</div>
          <div style="font-size: 11px; color: #64748b;">Exam Portal</div>
        </div>
      </div>
      <button class="btn-admin" onclick="openAdmin()">⚙️ Admin</button>
    </div>
  </header>

  <main id="app">
    <div style="text-align:center; padding:40px; color:#64748b;">डेटा लोड हो रहा है...</div>
  </main>

  <script>
    const FIREBASE_DB_URL = "https://political-science-quiz-6bfb1-default-rtdb.firebaseio.com";
    let allTests = [];
    let selectedSection = 'All';
    let currentQuiz = null, cur = 0, answers = {}, timer = null, sec = 0;
    let editingTestId = null, draftQuestions = [];

    async function loadCloudData() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/tests.json`);
        const data = await res.json();
        allTests = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
      } catch (err) { allTests = []; }
      showHome();
    }

    async function saveToCloud() {
      try {
        await fetch(`${FIREBASE_DB_URL}/tests.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(allTests)
        });
        alert('🎉 क्लाउड पर सेव हो गया! सभी दोस्तों के फोन पर लाइव है।');
      } catch (e) { alert('सेव करने में समस्या हुई। इंटरनेट चेक करें!'); }
    }

    function showHome() {
      if(timer) clearInterval(timer);
      const sections = ['All'];
      allTests.forEach(t => {
        const s = (t.section || 'सामान्य').trim();
        if(!sections.includes(s)) sections.push(s);
      });

      let tabsHtml = '';
      sections.forEach(s => {
        tabsHtml += `<button class="tab-btn ${selectedSection === s ? 'active' : ''}" onclick="selectedSection='${s}'; showHome();">${s === 'All' ? 'सभी' : s}</button>`;
      });

      const filtered = (selectedSection === 'All') ? allTests : allTests.filter(t => (t.section || 'सामान्य').trim() === selectedSection);

      let cardsHtml = '';
      if(filtered.length === 0) {
        cardsHtml = '<div style="text-align:center; padding:30px; color:#64748b; font-size:13px;">अभी कोई टेस्ट उपलब्ध नहीं है। Admin से नया टेस्ट जोड़ें।</div>';
      } else {
        filtered.forEach(t => {
          const idx = allTests.findIndex(item => item.id === t.id);
          cardsHtml += `
            <div class="card">
              <span class="tag">${t.section}</span>
              <h3 style="font-size: 15px; margin-bottom: 4px;">${t.title}</h3>
              <p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">${t.desc || ''}</p>
              <div class="card-footer">
                <span style="font-size: 11px; color: #475569;">⏱️ ${t.time} मिनट | 📝 ${t.questions.length} प्रश्न</span>
                <button class="btn-primary" onclick="startTest(${idx})">शुरू करें →</button>
              </div>
            </div>`;
        });
      }

      document.getElementById('app').innerHTML = `
        <div class="banner">
          <h2 style="font-size: 16px; margin-bottom:4px;">Political Science Exam Portal</h2>
          <p style="font-size: 12px; opacity:0.9;">RPSC, Assistant Professor, UP, DSSSB Quiz Series</p>
        </div>
        <div class="tabs-wrapper">${tabsHtml}</div>
        ${cardsHtml}
      `;
    }

    function startTest(index) {
      currentQuiz = allTests[index];
      cur = 0; answers = {}; sec = currentQuiz.time * 60;
      if(timer) clearInterval(timer);
      timer = setInterval(() => {
        sec--;
        const el = document.getElementById('tm');
        if(el) el.innerText = `⏳ ${Math.floor(sec/60)}:${sec%60 < 10 ? '0':''}${sec%60}`;
        if(sec <= 0) { clearInterval(timer); finishTest(); }
      }, 1000);
      renderQ();
    }

    function renderQ() {
      const q = currentQuiz.questions[cur];
      let optH = '';
      q.opt.forEach((o, i) => {
        optH += `<button class="opt-btn ${answers[cur] === i ? 'selected':''}" onclick="answers[${cur}]=${i}; renderQ();"><span>${String.fromCharCode(65+i)}. ${o}</span> ${answers[cur] === i ? '✓':''}</button>`;
      });

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:12px;">
            <span style="font-weight:700; color:#2563eb;">${currentQuiz.section}</span>
            <span id="tm" style="font-weight:700;">⏳ ${Math.floor(sec/60)}:${sec%60 < 10 ? '0':''}${sec%60}</span>
          </div>
          <div style="font-size:12px; color:#64748b; margin-bottom:6px;">प्रश्न ${cur+1} / ${currentQuiz.questions.length}</div>
          <h3 style="font-size:15px; margin-bottom:12px;">${q.q}</h3>
          <div>${optH}</div>
          <div class="card-footer">
            <button class="btn-outline" ${cur===0?'disabled style="opacity:0.3"':''} onclick="cur--; renderQ();">← पिछला</button>
            ${cur < currentQuiz.questions.length-1 ? `<button class="btn-primary" onclick="cur++; renderQ();">अगला →</button>` : `<button class="btn-success" onclick="finishTest()">सबमिट ✓</button>`}
          </div>
        </div>`;
    }

    function finishTest() {
      if(timer) clearInterval(timer);
      let cor = 0;
      currentQuiz.questions.forEach((q, i) => { if(answers[i] === q.ans) cor++; });
      document.getElementById('app').innerHTML = `
        <div class="card" style="text-align:center;">
          <h3>परीक्षण परिणाम</h3>
          <div style="font-size:28px; font-weight:800; color:#2563eb; margin:14px 0;">${cor} / ${currentQuiz.questions.length}</div>
          <button class="btn-primary" onclick="showHome()">होम पेज</button>
        </div>`;
    }

    function openAdmin() {
      if (prompt('Admin PIN (1234):') === '1234') renderAdminHome();
    }

    function renderAdminHome() {
      let testListHtml = '';
      allTests.forEach((t) => {
        testListHtml += `
          <div style="background:#fff; border:1px solid #cbd5e1; border-radius:6px; padding:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
            <div><b>${t.title}</b><div style="font-size:11px; color:#64748b;">${t.section} · ${t.questions.length} प्रश्न</div></div>
            <button class="btn-danger" onclick="if(confirm('हटाएं?')){ allTests=allTests.filter(x=>x.id!=='${t.id}'); saveToCloud(); renderAdminHome(); }">Delete</button>
          </div>`;
      });

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
            <h3>⚙️ Admin Panel</h3>
            <button class="btn-outline" onclick="showHome()">✕ बंद करें</button>
          </div>
          <div style="background:#f8fafc; border:1px dashed #2563eb; padding:10px; border-radius:8px; margin-bottom:12px;">
            <div style="font-size:12px; font-weight:700; color:#1e40af; margin-bottom:4px;">📋 JSON Paste करके सभी के लिए जोड़ें:</div>
            <textarea id="raw-json-paste" class="form-control" style="min-height:70px; font-family:monospace;" placeholder="यहाँ JSON कोड पेस्ट करें..."></textarea>
            <button class="btn-primary" style="margin-top:6px; width:100%;" onclick="importFromPasteBox()">☁️ क्लाउड पर लाइव करें</button>
          </div>
          <h4 style="margin-bottom:8px; font-size:13px;">उपलब्ध टेस्ट्स (${allTests.length}):</h4>
          ${testListHtml}
        </div>`;
    }

    async function importFromPasteBox() {
      const txt = document.getElementById('raw-json-paste').value.trim();
      if(!txt) return alert('डेटा पेस्ट करें!');
      try {
        const item = JSON.parse(txt);
        let list = Array.isArray(item) ? item : [item];
        list.forEach(n => {
          const idx = allTests.findIndex(x => x.id === n.id || x.title === n.title);
          if(idx !== -1) allTests[idx] = n; else allTests.push(n);
        });
        await saveToCloud();
        renderAdminHome();
      } catch(e) { alert('गलत JSON फॉर्मेट!'); }
    }

    loadCloudData();
  </script>
</body>
</html>

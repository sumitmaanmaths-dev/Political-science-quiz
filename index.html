<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Political Science Quiz - RPSC, Assistant Professor & Lecturer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yantramanav:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Yantramanav', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .font-display {
      font-family: 'Rozha One', serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- AUDIO SYNTHESIZER ---
    const playTone = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(196, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch(e) {}
    };

    // --- DEFAULT POLITICAL SCIENCE TESTS ---
    const DEFAULT_TESTS = [
      {
        id: "pol-science-01",
        title: "भारतीय संविधान एवं राज्यव्यवस्था - टेस्ट 01",
        description: "संविधान सभा, मौलिक अधिकार, नीति निदेशक तत्व एवं संसदीय शासन प्रणाली।",
        category: "Political Science",
        timeLimitMinutes: 10,
        totalMarks: 10,
        negativeMarking: 0.33,
        createdAt: new Date().toISOString(),
        questions: [
          {
            id: "q1",
            question: "भारतीय संविधान की प्रारूप समिति (Drafting Committee) के अध्यक्ष कौन थे?",
            options: ["डॉ. राजेन्द्र प्रसाद", "डॉ. बी. आर. अम्बेडकर", "जवाहरलाल नेहरू", "सर बी. एन. राव"],
            correctAnswer: 1,
            explanation: "प्रारूप समिति के अध्यक्ष डॉ. भीमराव अम्बेडकर थे। इस समिति में 7 सदस्य थे।",
            category: "संविधान सभा"
          },
          {
            id: "q2",
            question: "संविधान के किस अनुच्छेद को डॉ. अम्बेडकर ने 'संविधान का हृदय और आत्मा' कहा था?",
            options: ["अनुच्छेद 14", "अनुच्छेद 19", "अनुच्छेद 21", "अनुच्छेद 32"],
            correctAnswer: 3,
            explanation: "अनुच्छेद 32 (संवैधानिक उपचारों का अधिकार) को डॉ. अम्बेडकर ने संविधान का हृदय और आत्मा माना था।",
            category: "मौलिक अधिकार"
          },
          {
            id: "q3",
            question: "राज्य के नीति निदेशक तत्व (DPSP) किस देश के संविधान से लिए गए हैं?",
            options: ["आयरलैंड", "संयुक्त राज्य अमेरिका", "रूस", "ब्रिटेन"],
            correctAnswer: 0,
            explanation: "भारतीय संविधान के भाग-4 में वर्णित नीति निदेशक तत्व आयरलैंड के संविधान से प्रेरित हैं।",
            category: "विदेशी स्रोत"
          },
          {
            id: "q4",
            question: "भारत में राष्ट्रपति पर महाभियोग चलाने की प्रक्रिया किस अनुच्छेद में वर्णित है?",
            options: ["अनुच्छेद 52", "अनुच्छेद 56", "अनुच्छेद 61", "अनुच्छेद 72"],
            correctAnswer: 2,
            explanation: "अनुच्छेद 61 में राष्ट्रपति पर महाभियोग (Impeachment) चलाने की प्रक्रिया का प्रावधान है।",
            category: "कार्यपालिका"
          }
        ]
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [tests, setTests] = useState(() => {
        const saved = localStorage.getItem('pol_science_tests_v2');
        return saved ? JSON.parse(saved) : DEFAULT_TESTS;
      });

      const [view, setView] = useState('home');
      const [activeTest, setActiveTest] = useState(null);
      const [activeResult, setActiveResult] = useState(null);
      const [adminPin, setAdminPin] = useState(() => localStorage.getItem('pol_admin_pin') || '1234');
      const [isAdminAuthed, setIsAdminAuthed] = useState(false);

      const handleStartQuiz = (test) => {
        playTone('click');
        setActiveTest(test);
        setView('quiz');
      };

      const handleFinishQuiz = (result) => {
        setActiveResult(result);
        setView('result');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div 
                onClick={() => { playTone('click'); setView('home'); }} 
                className="flex items-center gap-3 cursor-pointer"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20 text-lg">
                  PS
                </div>
                <div>
                  <h1 className="font-display font-bold text-lg text-slate-900 leading-tight">Political Science Quiz</h1>
                  <p className="text-[11px] text-slate-500 font-medium">Competitive Exam Portal</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => {
                    playTone('click');
                    if (isAdminAuthed) setView('admin');
                    else {
                      const pin = prompt('Enter Admin PIN (Default: 1234):');
                      if (pin === adminPin) {
                        setIsAdminAuthed(true);
                        setView('admin');
                      } else if (pin !== null) {
                        alert('Wrong PIN!');
                      }
                    }
                  }}
                  className="px-3.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold transition-all border border-blue-200"
                >
                  ⚙️ Admin
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
            {view === 'home' && <HomeView tests={tests} onStart={handleStartQuiz} />}
            {view === 'quiz' && <QuizView test={activeTest} onFinish={handleFinishQuiz} onExit={() => setView('home')} />}
            {view === 'result' && <ResultView result={activeResult} test={activeTest} onHome={() => setView('home')} onRetry={() => handleStartQuiz(activeTest)} />}
            {view === 'admin' && (
              <AdminView 
                tests={tests} 
                onUpdateTests={(updated) => {
                  setTests(updated);
                  localStorage.setItem('pol_science_tests_v2', JSON.stringify(updated));
                }} 
                onClose={() => setView('home')} 
                adminPin={adminPin}
                setAdminPin={setAdminPin}
              />
            )}
          </main>
        </div>
      );
    }

    // --- HOME VIEW WITH YOUR UPDATED BANNER ---
    function HomeView({ tests, onStart }) {
      return (
        <div className="space-y-6">
          {/* Targeted Banner */}
          <div className="rounded-2xl bg-gradient-to-r from-blue-700 via-indigo-700 to-blue-800 text-white p-6 sm:p-8 shadow-lg">
            <span className="text-blue-200 text-xs font-bold uppercase tracking-wider">Exam Prep Series</span>
            <h2 className="text-xl sm:text-2xl font-display font-bold mt-1 mb-2 leading-snug">
              Political science for RPSC school lecturer, assistant Professor, UP assistant Professor, DSSSB school lecturer etc.
            </h2>
            <p className="text-blue-100 text-sm max-w-2xl leading-relaxed mt-2">
              Best questions for each topic and try to boost your preparation.
            </p>
          </div>

          {/* Available Tests Grid */}
          <div>
            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center justify-between">
              <span>उपलब्ध टेस्ट श्रृंखला</span>
              <span className="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-bold">{tests.length} टेस्ट</span>
            </h3>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {tests.map(test => (
                <div key={test.id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">
                        {test.category}
                      </span>
                      <span className="text-xs text-slate-500 font-medium">⏱️ {test.timeLimitMinutes} मिनट</span>
                    </div>
                    <h4 className="font-bold text-slate-900 text-base leading-snug mb-1">{test.title}</h4>
                    <p className="text-xs text-slate-500 mb-4 line-clamp-2">{test.description}</p>
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                    <span className="text-xs text-slate-600 font-semibold">
                      📝 {test.questions.length} प्रश्न &nbsp;·&nbsp; 🎯 {test.totalMarks} अंक
                    </span>
                    <button
                      onClick={() => onStart(test)}
                      className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm transition-all"
                    >
                      टेस्ट शुरू करें →
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- QUIZ VIEW ---
    function QuizView({ test, onFinish, onExit }) {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(test.timeLimitMinutes * 60);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 1) {
              clearInterval(timer);
              handleSubmit();
              return 0;
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [answers]);

      const handleSelectOption = (optIdx) => {
        playTone('click');
        setAnswers({ ...answers, [currentIdx]: optIdx });
      };

      const handleSubmit = () => {
        let correctCount = 0;
        let wrongCount = 0;
        let skippedCount = 0;

        test.questions.forEach((q, idx) => {
          if (answers[idx] === undefined) {
            skippedCount++;
          } else if (answers[idx] === q.correctAnswer) {
            correctCount++;
          } else {
            wrongCount++;
          }
        });

        const perQMarks = test.totalMarks / (test.questions.length || 1);
        const earned = (correctCount * perQMarks) - (wrongCount * (test.negativeMarking || 0));
        const finalScore = Math.max(0, Number(earned.toFixed(2)));

        playTone(finalScore >= (test.totalMarks * 0.6) ? 'correct' : 'wrong');

        onFinish({
          testId: test.id,
          score: finalScore,
          totalQuestions: test.questions.length,
          correctCount,
          wrongCount,
          skippedCount,
          userAnswers: answers,
          timeTaken: (test.timeLimitMinutes * 60) - timeLeft
        });
      };

      const q = test.questions[currentIdx];
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div className="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6">
          <div className="flex items-center justify-between pb-4 border-b border-slate-200">
            <div>
              <span className="text-xs text-blue-600 font-bold uppercase">{test.category}</span>
              <h3 className="font-bold text-slate-900 text-sm">{test.title}</h3>
            </div>
            <div className="flex items-center gap-3">
              <span className={`px-3 py-1.5 rounded-lg text-sm font-bold font-mono ${timeLeft < 120 ? 'bg-red-100 text-red-700 animate-pulse' : 'bg-blue-50 text-blue-800'}`}>
                ⏳ {formatTime(timeLeft)}
              </span>
              <button 
                onClick={() => { if(confirm('क्या आप सच में टेस्ट छोड़ना चाहते हैं?')) onExit(); }}
                className="text-xs text-slate-400 hover:text-red-600 font-bold px-2 py-1"
              >
                छोड़ें
              </button>
            </div>
          </div>

          <div className="space-y-1">
            <div className="flex justify-between text-xs font-bold text-slate-600">
              <span>प्रश्न {currentIdx + 1} / {test.questions.length}</span>
              <span>हल किए गए: {Object.keys(answers).length}</span>
            </div>
            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div 
                className="bg-blue-600 h-full transition-all duration-300"
                style={{ width: `${((currentIdx + 1) / test.questions.length) * 100}%` }}
              ></div>
            </div>
          </div>

          <div className="py-2">
            <h4 className="text-base sm:text-lg font-bold text-slate-900 leading-relaxed">
              {currentIdx + 1}. {q.question}
            </h4>
          </div>

          <div className="space-y-3">
            {q.options.map((opt, oIdx) => {
              const isSelected = answers[currentIdx] === oIdx;
              return (
                <button
                  key={oIdx}
                  onClick={() => handleSelectOption(oIdx)}
                  className={`w-full text-left p-4 rounded-xl border text-sm font-medium transition-all flex items-center justify-between ${
                    isSelected 
                      ? 'border-blue-600 bg-blue-50 text-blue-900 font-bold shadow-sm'
                      : 'border-slate-200 hover:bg-slate-50 text-slate-800'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${
                      isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'
                    }`}>
                      {String.fromCharCode(65 + oIdx)}
                    </span>
                    <span>{opt}</span>
                  </div>
                  {isSelected && <span className="text-blue-600 font-bold">✓</span>}
                </button>
              );
            })}
          </div>

          <div className="flex items-center justify-between pt-4 border-t border-slate-200">
            <button
              disabled={currentIdx === 0}
              onClick={() => { playTone('click'); setCurrentIdx(c => c - 1); }}
              className="px-4 py-2 rounded-lg border border-slate-300 font-bold text-xs text-slate-700 disabled:opacity-30"
            >
              ← पिछला
            </button>

            {currentIdx < test.questions.length - 1 ? (
              <button
                onClick={() => { playTone('click'); setCurrentIdx(c => c + 1); }}
                className="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm"
              >
                अगला प्रश्न →
              </button>
            ) : (
              <button
                onClick={handleSubmit}
                className="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm"
              >
                सबमिट करें ✓
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- RESULT VIEW ---
    function ResultView({ result, test, onHome, onRetry }) {
      return (
        <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm text-center space-y-6">
          <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold border border-blue-200">
            🎯
          </div>
          <div>
            <h2 className="text-2xl font-bold text-slate-900">परीक्षण परिणाम</h2>
            <p className="text-slate-500 text-sm mt-1">{test.title}</p>
          </div>

          <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
            <span className="text-xs text-slate-500 uppercase font-bold tracking-wider">Score</span>
            <div className="text-4xl font-black text-blue-600 mt-1">
              {result.score} <span className="text-lg text-slate-400 font-normal">/ {test.totalMarks}</span>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div className="p-3 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200">
              <div className="text-xl font-bold">{result.correctCount}</div>
              <div className="text-xs font-semibold">सही उत्तर</div>
            </div>
            <div className="p-3 bg-red-50 text-red-800 rounded-xl border border-red-200">
              <div className="text-xl font-bold">{result.wrongCount}</div>
              <div className="text-xs font-semibold">गलत उत्तर</div>
            </div>
            <div className="p-3 bg-slate-100 text-slate-700 rounded-xl border border-slate-200">
              <div className="text-xl font-bold">{result.skippedCount}</div>
              <div className="text-xs font-semibold">छोड़े गए</div>
            </div>
          </div>

          <div className="text-left space-y-4 pt-4 border-t border-slate-100">
            <h4 className="font-bold text-slate-800 text-sm">प्रश्नों का विवरण एवं व्याख्या:</h4>
            {test.questions.map((q, idx) => {
              const userAns = result.userAnswers[idx];
              const isCorrect = userAns === q.correctAnswer;
              return (
                <div key={idx} className="p-4 rounded-xl border border-slate-200 bg-slate-50 text-xs space-y-1">
                  <div className="font-bold text-slate-900">{idx + 1}. {q.question}</div>
                  <div className={isCorrect ? 'text-emerald-700 font-bold' : 'text-red-600 font-bold'}>
                    आपका उत्तर: {userAns !== undefined ? q.options[userAns] : 'नहीं दिया'} {isCorrect ? '✓' : '✗'}
                  </div>
                  {!isCorrect && (
                    <div className="text-slate-700 font-semibold">
                      सही उत्तर: {q.options[q.correctAnswer]}
                    </div>
                  )}
                  {q.explanation && (
                    <div className="text-slate-500 pt-1 italic">व्याख्या: {q.explanation}</div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="flex gap-3 justify-center pt-2">
            <button
              onClick={onRetry}
              className="px-5 py-2.5 rounded-lg border border-slate-300 font-bold text-xs text-slate-700 hover:bg-slate-50"
            >
              दोबारा हल करें
            </button>
            <button
              onClick={onHome}
              className="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs"
            >
              होम पेज पर जाएं
            </button>
          </div>
        </div>
      );
    }

    // --- ADMIN VIEW ---
    function AdminView({ tests, onUpdateTests, onClose, adminPin, setAdminPin }) {
      const [title, setTitle] = useState('');
      const [timeLimit, setTimeLimit] = useState(10);
      const [totalMarks, setTotalMarks] = useState(10);

      const handleAddEmptyTest = () => {
        if (!title.trim()) return alert('कृपया टेस्ट का नाम भरें!');
        const newTest = {
          id: 'test-' + Date.now(),
          title,
          category: 'Political Science',
          description: 'Topic Wise Test',
          timeLimitMinutes: Number(timeLimit),
          totalMarks: Number(totalMarks),
          negativeMarking: 0.33,
          createdAt: new Date().toISOString(),
          questions: [
            {
              id: 'q1',
              question: 'प्रश्न यहाँ लिखें...',
              options: ['Option A', 'Option B', 'Option C', 'Option D'],
              correctAnswer: 0,
              explanation: ''
            }
          ]
        };
        onUpdateTests([newTest, ...tests]);
        setTitle('');
        alert('टेस्ट सेव हो गया!');
      };

      return (
        <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6">
          <div className="flex items-center justify-between pb-4 border-b border-slate-200">
            <h3 className="font-bold text-slate-900 text-lg">⚙️ Admin Control Panel</h3>
            <button onClick={onClose} className="px-3 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold">
              ✕ Close
            </button>
          </div>

          <div className="space-y-4">
            <h4 className="font-bold text-sm text-slate-800">नया टेस्ट जोड़ें</h4>
            <input 
              type="text" 
              placeholder="टेस्ट का शीर्षक (Title)" 
              value={title} 
              onChange={e => setTitle(e.target.value)}
              className="w-full p-2.5 rounded-lg border border-slate-300 text-xs"
            />
            <div className="flex gap-2">
              <input 
                type="number" 
                placeholder="समय (मिनट)" 
                value={timeLimit} 
                onChange={e => setTimeLimit(e.target.value)}
                className="w-1/2 p-2.5 rounded-lg border border-slate-300 text-xs"
              />
              <input 
                type="number" 
                placeholder="कुल अंक" 
                value={totalMarks} 
                onChange={e => setTotalMarks(e.target.value)}
                className="w-1/2 p-2.5 rounded-lg border border-slate-300 text-xs"
              />
            </div>
            <button 
              onClick={handleAddEmptyTest}
              className="w-full py-2.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700"
            >
              + टेस्ट सेव करें
            </button>
          </div>
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

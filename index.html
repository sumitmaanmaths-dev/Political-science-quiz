  <script>
    // Audio synthesizer
    function playTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(196, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch(e) {}
    }

          ],
          correctAnswer: 1,
          explanation: "कौटिल्य के अनुसार दंडनीति का कार्य: अप्राप्त की प्राप्ति, प्राप्त की रक्षा, रक्षित की वृद्धि और संवर्धित का वितरण है।"
        },
        {
          question: "कौटिल्य के राजनीतिक दर्शन में राजा और राज्य के संबंधों के बारे में कौन से विद्वान यह मानते हैं कि कौटिल्य की दृष्टि में राजा और राज्य एक ही हैं?",
          options: [

        },
        {

          options: [
            "राजा की व्यक्तिगत प्रतिष्ठा बढ़ाने हेतु",
            "साम्राज्य की सुरक्षा और स्थिरता हेतु",
            "कर संग्रह की प्रक्रिया सरल बनाने हेतु",
            "धार्मिक अनुष्ठानों के लिए धन जुटाने हेतु"
          ],
          correctAnswer: 1,
          explanation: "कौटिल्य के अनुसार दरिद्रता आंतरिक विद्रोह और अशांति का कारण बनती है, अतः राज्य की स्थिरता हेतु गरीबी निवारण आवश्यक है।"
        }
      ]
    };

    // State Variables
    let currentIdx = 0;
    let userAnswers = {};
    let timerInterval = null;
    let timeLeft = 0;

    // Show Home Screen
    function showHome() {

      const root = document.getElementById('app-root');
      root.innerHTML = `

            <p class="text-blue-100 text-sm max-w-2xl leading-relaxed mt-2">

            </p>
          </div>

            </h3>

              <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">

                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">

                    </span>

                </div>

                <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                  <span class="text-xs text-slate-600 font-semibold">
                    📝 ${quizData.questions.length} प्रश्न &nbsp;·&nbsp; 🎯 ${quizData.totalMarks} अंक
                  </span>
                  <button onclick="startQuiz()" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm transition-all">

                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Start Quiz
    function startQuiz() {
      playTone('click');
      currentIdx = 0;
      userAnswers = {};
      timeLeft = quizData.timeLimitMinutes * 60;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById('timer-text');
        if (timerEl) {
          const m = Math.floor(timeLeft / 60);
          const s = timeLeft % 60;
          timerEl.innerText = `⏳ ${m}:${s < 10 ? '0' : ''}${s}`;
        }
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          finishQuiz();
        }
      }, 1000);

      renderQuestion();
    }

    // Render Question
    function renderQuestion() {
      const q = quizData.questions[currentIdx];
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      const progressPercent = ((currentIdx + 1) / quizData.questions.length) * 100;

      let optionsHtml = '';
      q.options.forEach((opt, oIdx) => {
        const isSelected = userAnswers[currentIdx] === oIdx;
        optionsHtml += `
          <button onclick="selectOption(${oIdx})" class="w-full text-left p-4 rounded-xl border text-sm font-medium transition-all flex items-center justify-between ${
            isSelected 
              ? 'border-blue-600 bg-blue-50 text-blue-900 font-bold shadow-sm'
              : 'border-slate-200 hover:bg-slate-50 text-slate-800'
          }">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${
                isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'
              }">
                ${String.fromCharCode(65 + oIdx)}
              </span>
              <span>${opt}</span>
            </div>
            ${isSelected ? '<span class="text-blue-600 font-bold">✓</span>' : ''}
          </button>
        `;
      });

      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6">
          <div class="flex items-center justify-between pb-4 border-b border-slate-200">
            <div>
              <span class="text-xs text-blue-600 font-bold uppercase">${quizData.category}</span>
              <h3 class="font-bold text-slate-900 text-sm">${quizData.title}</h3>
            </div>
            <div class="flex items-center gap-3">
              <span id="timer-text" class="px-3 py-1.5 rounded-lg text-sm font-bold font-mono ${timeLeft < 120 ? 'bg-red-100 text-red-700 animate-pulse' : 'bg-blue-50 text-blue-800'}">
                ⏳ ${m}:${s < 10 ? '0' : ''}${s}
              </span>
              <button onclick="if(confirm('क्या आप सच में टेस्ट छोड़ना चाहते हैं?')) showHome()" class="text-xs text-slate-400 hover:text-red-600 font-bold px-2 py-1">
                छोड़ें
              </button>
            </div>
          </div>

          <div class="space-y-1">
            <div class="flex justify-between text-xs font-bold text-slate-600">
              <span>प्रश्न ${currentIdx + 1} / ${quizData.questions.length}</span>
              <span>हल किए गए: ${Object.keys(userAnswers).length}</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div class="bg-blue-600 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <div class="py-2">
            <h4 class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed">
              ${currentIdx + 1}. ${q.question}
            </h4>
          </div>

          <div class="space-y-3">${optionsHtml}</div>

          <div class="flex items-center justify-between pt-4 border-t border-slate-200">
            <button ${currentIdx === 0 ? 'disabled' : ''} onclick="prevQuestion()" class="px-4 py-2 rounded-lg border border-slate-300 font-bold text-xs text-slate-700 disabled:opacity-30">
              ← पिछला
            </button>

            ${currentIdx < quizData.questions.length - 1 ? `
              <button onclick="nextQuestion()" class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm">
                अगला प्रश्न →
              </button>
            ` : `
              <button onclick="finishQuiz()" class="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm">
                सबमिट करें ✓
              </button>
            `}
          </div>
        </div>
      `;
    }

    function selectOption(oIdx) {
      playTone('click');
      userAnswers[currentIdx] = oIdx;
      renderQuestion();
    }

    function nextQuestion() {
      playTone('click');
      if (currentIdx < quizData.questions.length - 1) {
        currentIdx++;
        renderQuestion();
      }
    }

    function prevQuestion() {
      playTone('click');
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function finishQuiz() {
      if (timerInterval) clearInterval(timerInterval);

      let correctCount = 0;
      let wrongCount = 0;
      let skippedCount = 0;

      quizData.questions.forEach((q, idx) => {
        if (userAnswers[idx] === undefined) {
          skippedCount++;
        } else if (userAnswers[idx] === q.correctAnswer) {
          correctCount++;
        } else {
          wrongCount++;
        }
      });

      const perQ = quizData.totalMarks / quizData.questions.length;
      const earned = (correctCount * perQ) - (wrongCount * quizData.negativeMarking);
      const finalScore = Math.max(0, Number(earned.toFixed(2)));

      playTone(finalScore >= (quizData.totalMarks * 0.6) ? 'correct' : 'wrong');

      let explanationHtml = '';
      quizData.questions.forEach((q, idx) => {
        const uAns = userAnswers[idx];
        const isCorrect = uAns === q.correctAnswer;
        explanationHtml += `
          <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 text-xs space-y-1">
            <div class="font-bold text-slate-900">${idx + 1}. ${q.question}</div>
            <div class="${isCorrect ? 'text-emerald-700 font-bold' : 'text-red-600 font-bold'}">
              आपका उत्तर: ${uAns !== undefined ? q.options[uAns] : 'नहीं दिया'} ${isCorrect ? '✓' : '✗'}
            </div>
            ${!isCorrect ? `<div class="text-slate-700 font-semibold">सही उत्तर: ${q.options[q.correctAnswer]}</div>` : ''}
            ${q.explanation ? `<div class="text-slate-500 pt-1 italic">व्याख्या: ${q.explanation}</div>` : ''}
          </div>
        `;
      });

      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm text-center space-y-6">
          <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold border border-blue-200">
            🎯
          </div>
          <div>
            <h2 class="text-2xl font-bold text-slate-900">परीक्षण परिणाम</h2>
            <p class="text-slate-500 text-sm mt-1">${quizData.title}</p>
          </div>

          <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
            <span class="text-xs text-slate-500 uppercase font-bold tracking-wider">Score</span>
            <div class="text-4xl font-black text-blue-600 mt-1">
              ${finalScore} <span class="text-lg text-slate-400 font-normal">/ ${quizData.totalMarks}</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="p-3 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200">
              <div class="text-xl font-bold">${correctCount}</div>
              <div class="text-xs font-semibold">सही उत्तर</div>
            </div>
            <div class="p-3 bg-red-50 text-red-800 rounded-xl border border-red-200">
              <div class="text-xl font-bold">${wrongCount}</div>
              <div class="text-xs font-semibold">गलत उत्तर</div>
            </div>
            <div class="p-3 bg-slate-100 text-slate-700 rounded-xl border border-slate-200">
              <div class="text-xl font-bold">${skippedCount}</div>
              <div class="text-xs font-semibold">छोड़े गए</div>
            </div>
          </div>

          <div class="text-left space-y-4 pt-4 border-t border-slate-100">
            <h4 class="font-bold text-slate-800 text-sm">प्रश्नों का विवरण एवं व्याख्या:</h4>
            ${explanationHtml}
          </div>

          <div class="flex gap-3 justify-center pt-2">
            <button onclick="startQuiz()" class="px-5 py-2.5 rounded-lg border border-slate-300 font-bold text-xs text-slate-700 hover:bg-slate-50">
              दोबारा हल करें
            </button>
            <button onclick="showHome()" class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs">
              होम पेज पर जाएं
            </button>
          </div>
        </div>
      `;
    }

    function openAdmin() {
      const pin = prompt('Enter Admin PIN (Default: 1234):');
      if (pin === '1234') {
        alert('एडमिन लॉगिन सफल!');
      } else if (pin !== null) {
        alert('गलत पिन!');
      }
    }

    // Initialize application
    showHome();
  </script>
</body>
</html>
